name: MacDown2
configs:
  Debug: debug
  Release: release
  UITestIsolated: debug
options:
  bundleIdPrefix: com.joncallim
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
packages:
  Textual:
    url: https://github.com/Joncallim/textual
    revision: 4bc5a45e384b596e0c1448888c8534a6df436c57
  SwiftUIMath:
    url: https://github.com/Joncallim/swiftui-math
    revision: 2a89c2b41482988711909572d116374e47a52164
  MacDownKit:
    path: Packages/MacDownKit
targets:
  MacDown2:
    type: application
    platform: macOS
    sources:
    - MacDown2
    - path: ../LICENSE
      type: file
      buildPhase: resources
    - path: ../compliance/generated/THIRD_PARTY_NOTICES.md
      type: file
      buildPhase: resources
    dependencies:
    - target: MostlyTextCommand
      link: false
    - target: MostlyTextQuickLook
      embed: true
      link: false
    - package: MacDownKit
      product: FileCore
    - package: MacDownKit
      product: CommandBridge
    - package: MacDownKit
      product: LocalResourceAccess
    - package: MacDownKit
      product: AppSettings
    - package: MacDownKit
      product: Themes
    - package: MacDownKit
      product: Workspace
    - package: MacDownKit
      product: JSONSupport
    - package: MacDownKit
      product: FileTree
    - package: MacDownKit
      product: EditorCore
    - package: MacDownKit
      product: TextSearch
    - package: MacDownKit
      product: Highlighting
    - package: MacDownKit
      product: MarkdownEngine
    - package: MacDownKit
      product: Preview
    - package: MacDownKit
      product: OutlineUI
    - package: MacDownKit
      product: ExportService
    - package: MacDownKit
      product: Contributions
    - package: MacDownKit
      product: TextFilters
    - package: MacDownKit
      product: Math
    - package: MacDownKit
      product: MathRendering
    - package: Textual
      product: Textual
    - package: SwiftUIMath
      product: SwiftUIMath
    - package: MacDownKit
      product: Diagrams
    - package: MacDownKit
      product: DiagramRendering
    - package: MacDownKit
      product: DiagramWebKitPool
    - package: MacDownKit
      product: DiagramsD2
    - package: MacDownKit
      product: D2Rendering
    - package: MacDownKit
      product: DiagramsGraphviz
    - package: MacDownKit
      product: GraphvizRendering
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.MostlyText
      configs:
        Release:
          ENABLE_TESTABILITY: 'YES'
        UITestIsolated:
          PRODUCT_BUNDLE_IDENTIFIER: '$(MOSTLYTEXT_UI_TEST_BUNDLE_ID)'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) UITEST_ISOLATED'
    info:
      path: MacDown2/Info.plist
      properties:
        CFBundleName: MostlyText
        CFBundleDisplayName: MostlyText
        MostlyTextUITestOwnerUID: '$(MOSTLYTEXT_UI_TEST_OWNER_UID)'
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        LSMinimumSystemVersion: '26.0'
        NSHumanReadableCopyright: "Copyright \xA9 2026 Joncallim"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
        - CFBundleTypeName: Markdown Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Default
          CFBundleTypeIconFile: MarkdownDocument
          LSItemContentTypes:
          - net.daringfireball.markdown
          - app.mostlytext.markdown-alias
          CFBundleTypeExtensions:
          - md
          - markdown
          - mdown
          - mkd
          - mkdn
        - CFBundleTypeName: HTML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Default
          LSItemContentTypes:
          - public.html
          CFBundleTypeExtensions:
          - html
          - htm
        - CFBundleTypeName: JSON Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Default
          LSItemContentTypes:
          - public.json
          CFBundleTypeExtensions:
          - json
        - CFBundleTypeName: YAML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Default
          LSItemContentTypes:
          - public.yaml
          CFBundleTypeExtensions:
          - yaml
          - yml
        - CFBundleTypeName: TOML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - com.joncallim.macdown2.toml
          CFBundleTypeExtensions:
          - toml
        - CFBundleTypeName: Plain Text Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Default
          LSItemContentTypes:
          - public.plain-text
          CFBundleTypeExtensions:
          - txt
        - CFBundleTypeName: Source Code
          CFBundleTypeRole: Editor
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - public.source-code
          CFBundleTypeExtensions:
          - js
          - jsx
          - ts
          - tsx
          - py
          - rb
          - css
          - swift
          - c
          - cpp
          - cc
          - cxx
          - h
          - hpp
          - sh
          - bash
          - zsh
          - sql
          - xml
          - tex
          - latex
        UTExportedTypeDeclarations:
        - UTTypeIdentifier: app.mostlytext.markdown-alias
          UTTypeDescription: Markdown Document
          UTTypeConformsTo:
          - net.daringfireball.markdown
          UTTypeTagSpecification:
            public.filename-extension:
            - mdown
            - mkd
            - mkdn
        - UTTypeIdentifier: app.mostlytext.theme
          UTTypeDescription: MostlyText Theme
          UTTypeConformsTo:
          - public.json
          UTTypeTagSpecification:
            public.filename-extension:
            - mostlytext-theme
        - UTTypeIdentifier: com.joncallim.macdown2.file-tree-item
          UTTypeDescription: MostlyText File Tree Item
          UTTypeConformsTo:
          - public.data
        - UTTypeIdentifier: com.joncallim.macdown2.toml
          UTTypeDescription: TOML Document
          UTTypeConformsTo:
          - public.text
          - public.plain-text
          UTTypeTagSpecification:
            public.filename-extension:
            - toml
    postBuildScripts:
    - name: Embed command-line executable
      path: scripts/embed-cli.sh
      inputFiles:
      - $(BUILT_PRODUCTS_DIR)/mostlytext
      - $(BUILT_PRODUCTS_DIR)/MacDownKit_CommandLineSupport.bundle
      outputFiles:
      - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/mostlytext-cli
      - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MacDownKit_CommandLineSupport.bundle
  MostlyTextQuickLook:
    type: app-extension
    platform: macOS
    sources:
    - MacDown2QuickLook
    dependencies:
    - package: MacDownKit
      product: QuickLookSource
    - target: MostlyTextQuickLookWorker
      embed: true
      link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.MostlyText.QuickLook
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: 'NO'
    info:
      path: MacDown2QuickLook/Info.plist
      properties:
        CFBundleDisplayName: MostlyText
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).MarkdownQuickLookProvider'
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [net.daringfireball.markdown]
    entitlements:
      path: MacDown2QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
  MostlyTextQuickLookWorker:
    type: xpc-service
    platform: macOS
    sources:
    - MacDown2QuickLookWorker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.MostlyText.QuickLook.Worker
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: 'NO'
    info:
      path: MacDown2QuickLookWorker/Info.plist
      properties:
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        XPCService:
          ServiceType: Application
    entitlements:
      path: MacDown2QuickLookWorker/Worker.entitlements
      properties:
        com.apple.security.app-sandbox: true
  MostlyTextCommand:
    type: tool
    settings:
      base:
        PRODUCT_NAME: mostlytext
        PRODUCT_MODULE_NAME: MostlyTextCommand
    platform: macOS
    sources:
    - MacDown2CLI
    dependencies:
    - package: MacDownKit
      product: FileCore
    - package: MacDownKit
      product: CommandBridge
    - package: MacDownKit
      product: CommandLineSupport
  MacDown2UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
    - MacDown2UITests
    dependencies:
    - target: MacDown2
    - package: MacDownKit
      product: Workspace
    settings:
      configs:
        UITestIsolated:
          PRODUCT_BUNDLE_IDENTIFIER: '$(MOSTLYTEXT_UI_TEST_BUNDLE_ID).UITests'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) UITEST_ISOLATED'
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: MacDown2
  MacDown2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
    - MacDown2Tests
    # Compile the original package controls against the same actual products in optimized app-host qualification.
    - Packages/MacDownKit/Tests/PreviewTests/PreviewImageDecodeBudgetTests.swift
    - Packages/MacDownKit/Tests/PreviewTests/TextualAttachmentInterceptionTests.swift
    dependencies:
    - target: MacDown2
    - package: MacDownKit
      product: FileCore
    - package: MacDownKit
      product: CommandBridge
    - package: MacDownKit
      product: LocalResourceAccess
    - package: MacDownKit
      product: Workspace
    - package: MacDownKit
      product: JSONSupport
    - package: MacDownKit
      product: EditorCore
    - package: MacDownKit
      product: FileTree
    - package: MacDownKit
      product: Themes
    - package: MacDownKit
      product: Highlighting
    - package: MacDownKit
      product: AppSettings
    - package: MacDownKit
      product: MarkdownEngine
    - package: MacDownKit
      product: ExportService
    - package: MacDownKit
      product: Contributions
    - package: MacDownKit
      product: Preview
    - package: MacDownKit
      product: TextFilters
    - package: MacDownKit
      product: Math
    - package: MacDownKit
      product: MathRendering
    - package: Textual
      product: Textual
    - package: MacDownKit
      product: Diagrams
    - package: MacDownKit
      product: DiagramRendering
    - package: MacDownKit
      product: DiagramWebKitPool
    - package: MacDownKit
      product: DiagramsD2
    - package: MacDownKit
      product: D2Rendering
    - package: MacDownKit
      product: DiagramsGraphviz
    - package: MacDownKit
      product: GraphvizRendering
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: MacDown2
schemes:
  Issue88Isolated:
    build:
      targets:
        MacDown2: all
    run:
      config: UITestIsolated
      executable: MacDown2
    test:
      config: UITestIsolated
      targets:
      - MacDown2UITests
  MacDown2:
    build:
      targets:
        MacDown2: all
    run:
      config: Debug
      executable: MacDown2
    test:
      targets:
      - MacDown2UITests
      - MacDown2Tests
  MostlyTextCLI:
    build:
      targets:
        MostlyTextCommand: all
