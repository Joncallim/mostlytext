name: MacDown2
options:
  bundleIdPrefix: com.joncallim
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
packages:
  MacDownKit:
    path: Packages/MacDownKit
targets:
  MacDown2:
    type: application
    platform: macOS
    sources:
    - MacDown2
    - path: ../LICENSE
      type: file
      buildPhase: resources
    - path: ../compliance/generated/THIRD_PARTY_NOTICES.md
      type: file
      buildPhase: resources
    dependencies:
    - package: MacDownKit
      product: FileCore
    - package: MacDownKit
      product: LocalResourceAccess
    - package: MacDownKit
      product: AppSettings
    - package: MacDownKit
      product: Themes
    - package: MacDownKit
      product: Workspace
    - package: MacDownKit
      product: FileTree
    - package: MacDownKit
      product: EditorCore
    - package: MacDownKit
      product: TextSearch
    - package: MacDownKit
      product: Highlighting
    - package: MacDownKit
      product: MarkdownEngine
    - package: MacDownKit
      product: Preview
    - package: MacDownKit
      product: OutlineUI
    - package: MacDownKit
      product: ExportService
    - package: MacDownKit
      product: Contributions
    - package: MacDownKit
      product: TextFilters
    - package: MacDownKit
      product: Math
    - package: MacDownKit
      product: MathRendering
    - package: MacDownKit
      product: Diagrams
    - package: MacDownKit
      product: DiagramRendering
    - package: MacDownKit
      product: DiagramWebKitPool
    - package: MacDownKit
      product: DiagramsD2
    - package: MacDownKit
      product: D2Rendering
    - package: MacDownKit
      product: DiagramsGraphviz
    - package: MacDownKit
      product: GraphvizRendering
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_TESTABILITY: 'YES'
    info:
      path: MacDown2/Info.plist
      properties:
        CFBundleName: MacDown 2
        CFBundleDisplayName: MacDown 2
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        LSMinimumSystemVersion: '26.0'
        NSHumanReadableCopyright: "Copyright \xA9 2026 Joncallim"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
        - CFBundleTypeName: Markdown Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Owner
          LSItemContentTypes:
          - net.daringfireball.markdown
          CFBundleTypeExtensions:
          - md
          - markdown
          - mdown
          - mkd
          - mkdn
        - CFBundleTypeName: HTML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Editor
          LSItemContentTypes:
          - public.html
          CFBundleTypeExtensions:
          - html
          - htm
        - CFBundleTypeName: JSON Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Editor
          LSItemContentTypes:
          - public.json
          CFBundleTypeExtensions:
          - json
        - CFBundleTypeName: YAML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Editor
          LSItemContentTypes:
          - public.yaml
          CFBundleTypeExtensions:
          - yaml
          - yml
        - CFBundleTypeName: TOML Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - com.joncallim.macdown2.toml
          CFBundleTypeExtensions:
          - toml
        - CFBundleTypeName: Plain Text Document
          CFBundleTypeRole: Editor
          LSHandlerRank: Editor
          LSItemContentTypes:
          - public.plain-text
          CFBundleTypeExtensions:
          - txt
        - CFBundleTypeName: Source Code
          CFBundleTypeRole: Editor
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - public.source-code
          CFBundleTypeExtensions:
          - js
          - jsx
          - ts
          - tsx
          - py
          - rb
          - css
          - swift
          - c
          - cpp
          - cc
          - cxx
          - h
          - hpp
          - sh
          - bash
          - zsh
          - sql
          - xml
          - tex
          - latex
        UTExportedTypeDeclarations:
        - UTTypeIdentifier: com.joncallim.macdown2.file-tree-item
          UTTypeDescription: MostlyText File Tree Item
          UTTypeConformsTo:
          - public.data
        - UTTypeIdentifier: com.joncallim.macdown2.toml
          UTTypeDescription: TOML Document
          UTTypeConformsTo:
          - public.text
          - public.plain-text
          UTTypeTagSpecification:
            public.filename-extension:
            - toml
  macdown2:
    type: tool
    platform: macOS
    sources:
    - MacDown2CLI
    dependencies:
    - package: MacDownKit
      product: FileCore
  MacDown2UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
    - MacDown2UITests
    dependencies:
    - target: MacDown2
    - package: MacDownKit
      product: Workspace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: MacDown2
  MacDown2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
    - MacDown2Tests
    dependencies:
    - target: MacDown2
    - package: MacDownKit
      product: FileCore
    - package: MacDownKit
      product: LocalResourceAccess
    - package: MacDownKit
      product: Workspace
    - package: MacDownKit
      product: EditorCore
    - package: MacDownKit
      product: FileTree
    - package: MacDownKit
      product: Themes
    - package: MacDownKit
      product: Highlighting
    - package: MacDownKit
      product: AppSettings
    - package: MacDownKit
      product: MarkdownEngine
    - package: MacDownKit
      product: ExportService
    - package: MacDownKit
      product: Contributions
    - package: MacDownKit
      product: Preview
    - package: MacDownKit
      product: TextFilters
    - package: MacDownKit
      product: Math
    - package: MacDownKit
      product: MathRendering
    - package: MacDownKit
      product: Diagrams
    - package: MacDownKit
      product: DiagramRendering
    - package: MacDownKit
      product: DiagramWebKitPool
    - package: MacDownKit
      product: DiagramsD2
    - package: MacDownKit
      product: D2Rendering
    - package: MacDownKit
      product: DiagramsGraphviz
    - package: MacDownKit
      product: GraphvizRendering
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: MacDown2
schemes:
  MacDown2:
    build:
      targets:
        MacDown2: all
    run:
      config: Debug
      executable: MacDown2
    test:
      targets:
      - MacDown2UITests
      - MacDown2Tests
  MacDown2CLI:
    build:
      targets:
        macdown2: all
