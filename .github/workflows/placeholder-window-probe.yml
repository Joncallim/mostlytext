name: Startup placeholder ownership counterexample
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/placeholder-window-probe/**'
      - '.github/scripts/run-placeholder-window-probe.py'
      - '.github/workflows/placeholder-window-probe.yml'
concurrency:
  group: placeholder-window-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classifier-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare only the trusted component counterexample
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-hosted-focus-guard.py
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/run-placeholder-window-probe.py prepare --mode reproduce-original
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Compile unchanged product with one explicitly added regression
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Debug -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/build.log"
      - name: Require the actual old-classifier assertion failure once
        run: |
          set -euo pipefail
          python3 .github/scripts/run-placeholder-window-probe.py execute --mode reproduce-original
      - name: Preserve complete first counterexample even if it fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeholder-window-classifier
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.log
            ${{ runner.temp }}/mostlytext-focus/probe-owned/**
            ${{ runner.temp }}/mostlytext-focus/Probe.xcresult/**
            ${{ runner.temp }}/mostlytext-focus/app/Build/Products/*.xctestrun
            MacDown2/MacDown2Tests/PlaceholderOwnershipProbeTests.swift
