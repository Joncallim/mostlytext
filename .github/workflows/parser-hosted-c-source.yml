name: Parser hosted C source qualification

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - epic/05-parser-hosted-graph
    paths:
      - .github/scripts/prepare-parser-hosted-c-source.py
      - .github/scripts/test-parser-hosted-c-source.py
      - .github/scripts/run-shared-subtree-comparison-probe.py
      - .github/workflows/parser-hosted-c-source.yml

concurrency:
  group: parser-hosted-c-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require deployment OS and ARM C compiler
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          clang --version
      - uses: actions/download-artifact@v4
        with:
          name: parser-hosted-graph-first
          run-id: 42487278217
          repository: Joncallim/mostlytext
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/parser-c-source/graph
      - name: Reject altered first graph artifact
        run: python3 .github/scripts/test-parser-hosted-c-source.py "$RUNNER_TEMP/parser-c-source/graph"
      - name: Verify remote source and stage disposable graph
        run: python3 .github/scripts/prepare-parser-hosted-c-source.py "$RUNNER_TEMP/parser-c-source"
      - name: Verify exact C pin and source refusal controls
        run: python3 "$RUNNER_TEMP/parser-c-source/checkout/.github/scripts/test-shared-subtree-pin-review.py"
      - name: Reproduce original failures and qualify candidate C source
        run: python3 "$RUNNER_TEMP/parser-c-source/checkout/.github/scripts/run-shared-subtree-comparison-probe.py" "$RUNNER_TEMP/parser-c-source/qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-hosted-c-source-diagnostic
          path: |
            ${{ runner.temp }}/parser-c-source/graph/receipt.json
            ${{ runner.temp }}/parser-c-source/graph/resolve.stdout
            ${{ runner.temp }}/parser-c-source/graph/resolve.stderr
            ${{ runner.temp }}/parser-c-source/graph/Packages/MacDownKit/Package.resolved
            ${{ runner.temp }}/parser-c-source/preparation.json
            ${{ runner.temp }}/parser-c-source/remote-sources.json
            ${{ runner.temp }}/parser-c-source/qualification/receipt.json
            ${{ runner.temp }}/parser-c-source/qualification/*.log
            ${{ runner.temp }}/parser-c-source/qualification/*.json
            ${{ runner.temp }}/parser-c-source/qualification/*.sample.txt
            ${{ runner.temp }}/parser-c-source/qualification/*-linked-libraries.txt
            ${{ runner.temp }}/parser-c-source/qualification/*-probe
          if-no-files-found: warn
