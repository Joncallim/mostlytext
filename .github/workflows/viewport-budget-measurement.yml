name: Mounted Markdown viewport Release measurement
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/viewport-budget-measurement.yml'
      - 'MacDown2/Packages/MacDownKit/Package.swift'
      - 'MacDown2/Packages/MacDownKit/Package.resolved'
      - 'MacDown2/Packages/MacDownKit/Sources/FileCore/String+ExactEquality.swift'
      - 'MacDown2/Packages/MacDownKit/Sources/Highlighting/**'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/MarkdownViewportBudgetBenchmarkTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportHighlighterBudgetBenchmarkTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportDisplayBudgetBenchmarkTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportMountedLifecycleOracleTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportMountedLifecycleDisplayTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportCacheRetirementBudgetTests.swift'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/BoundedMarkdownCacheRetirementTests.swift'
  workflow_dispatch:
jobs:
  viewport-budget:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select macOS 26 and Xcode 26.6
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          SELECTED=""
          for CANDIDATE in /Applications/Xcode*.app; do
            if test "$(DEVELOPER_DIR="$CANDIDATE/Contents/Developer" xcodebuild -version | head -n 1)" = 'Xcode 26.6'; then
              SELECTED="$CANDIDATE"
              break
            fi
          done
          test -n "$SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          sw_vers
      - name: Bind the exact source and toolchain
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/viewport-budget"
          git rev-parse HEAD > "$RUNNER_TEMP/viewport-budget/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/viewport-budget/xcode.txt"
          sw_vers > "$RUNNER_TEMP/viewport-budget/macos.txt"
          shasum -a 256 \
            MacDown2/Packages/MacDownKit/Package.swift \
            MacDown2/Packages/MacDownKit/Package.resolved \
            MacDown2/Packages/MacDownKit/Sources/FileCore/String+ExactEquality.swift \
            MacDown2/Packages/MacDownKit/Sources/Highlighting/SyntaxHighlightStore.swift \
            MacDown2/Packages/MacDownKit/Sources/Highlighting/MarkdownViewportSession.swift \
            MacDown2/Packages/MacDownKit/Sources/Highlighting/BoundedMarkdownCacheRetirement.swift \
            MacDown2/Packages/MacDownKit/Sources/Highlighting/NeonSyntaxHighlighter+Viewport.swift \
            MacDown2/Packages/MacDownKit/Sources/Highlighting/NeonSyntaxHighlighter+SizeFallback.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportHighlighterIntegrationTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/MarkdownViewportBudgetBenchmarkTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportHighlighterBudgetBenchmarkTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportDisplayBudgetBenchmarkTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportMountedLifecycleOracleTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportMountedLifecycleDisplayTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/ViewportCacheRetirementBudgetTests.swift \
            MacDown2/Packages/MacDownKit/Tests/HighlightingTests/BoundedMarkdownCacheRetirementTests.swift \
            .github/workflows/viewport-budget-measurement.yml \
            > "$RUNNER_TEMP/viewport-budget/input-sha256.txt"
      - name: Measure mounted session and public highlighter in Release
        env:
          MACDOWN_VIEWPORT_BUDGET_BENCH: '1'
        run: |
          set -euo pipefail
          cd MacDown2/Packages/MacDownKit
          swift test -c release --filter MarkdownViewportBudgetBenchmarkTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/session.log"
          swift test -c release --filter ViewportHighlighterBudgetBenchmarkTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/highlighter.log"
          MACDOWN_VIEWPORT_DISPLAY_BENCH=1 \
            swift test -c release --filter ViewportDisplayBudgetBenchmarkTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/display.log"
          MACDOWN_VIEWPORT_LIFECYCLE_ORACLE=1 \
            swift test -c release --filter ViewportMountedLifecycleOracleTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/lifecycle.log"
          MACDOWN_VIEWPORT_LIFECYCLE_DISPLAY=1 \
            swift test -c release --filter ViewportMountedLifecycleDisplayTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/lifecycle-display.log"
          MACDOWN_VIEWPORT_CACHE_RETIREMENT_BENCH=1 \
            swift test -c release --filter ViewportCacheRetirementBudgetTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/cache-retirement.log"
          swift test -c release --filter BoundedMarkdownCacheRetirementTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/viewport-budget/retirement-order.log"
      - name: Record complete measured cases
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ['RUNNER_TEMP']) / 'viewport-budget'
          expected = {
              'session': ('VIEWPORT-BUDGET', 1),
              'highlighter': ('HIGHLIGHTER-MODE-BUDGET', 2),
          }
          records = {}
          for name, (prefix, line_count) in expected.items():
              log = (root / f'{name}.log').read_text()
              assert 'Test run with 1 test in 1 suite passed' in log, name
              lines = [line for line in log.splitlines() if line.startswith(prefix + ' ')]
              assert len(lines) == line_count, (name, len(lines))
              cases = []
              for line in lines:
                  size = int(re.search(r'\butf8=(\d+)', line).group(1))
                  calls = [float(value.strip()) for value in re.search(r'\bcalls=\[([^]]+)\]', line).group(1).split(',')]
                  settled = [float(value.strip()) for value in re.search(r'\bsettled=\[([^]]+)\]', line).group(1).split(',')]
                  assert size >= 1 << 20 and len(calls) == len(settled) == 12, line
                  cases.append({'utf8_bytes': size, 'call_ms': calls, 'settled_ms': settled,
                                'raw': line})
              records[name] = cases
          display_log = (root / 'display.log').read_text()
          assert 'Test run with 1 test in 1 suite passed' in display_log
          lifecycle_log = (root / 'lifecycle.log').read_text()
          assert 'Test run with 1 test in 1 suite passed' in lifecycle_log
          assert 'ViewportMountedLifecycleOracleTests' in lifecycle_log
          retirement_log = (root / 'cache-retirement.log').read_text()
          assert 'Test run with 1 test in 1 suite passed' in retirement_log
          retirement_cases = re.findall(r'VIEWPORT-CACHE-RETIREMENT input_return_ms=([0-9.]+) utf8=(\d+)',
                                        retirement_log)
          assert len(retirement_cases) == 1, retirement_cases
          retirement_ms, retirement_bytes = retirement_cases[0]
          assert float(retirement_ms) < 50 and int(retirement_bytes) >= 1 << 20
          records['cache_retirement'] = {'input_return_ms': float(retirement_ms),
                                         'utf8_bytes': int(retirement_bytes),
                                         'scope': 'ordinary mounted structural input return; overflow is synchronous and has no latency claim; distinct from visible display'}
          retirement_order_log = (root / 'retirement-order.log').read_text()
          assert 'Test run with 1 test in 1 suite passed' in retirement_order_log
          assert 'BoundedMarkdownCacheRetirementTests' in retirement_order_log
          records['lifecycle'] = {
              'passed': True,
              'scope': 'full-size mounted source/selection/lifecycle oracle; manual painter validation means no automatic repaint claim'
          }
          lifecycle_display_log = (root / 'lifecycle-display.log').read_text()
          assert 'Test run with 1 test in 1 suite passed' in lifecycle_display_log
          lifecycle_display_lines = [line for line in lifecycle_display_log.splitlines()
                                     if line.startswith('VIEWPORT-LIFECYCLE-DISPLAY ')]
          assert len(lifecycle_display_lines) == 1
          lifecycle_display = json.loads(lifecycle_display_lines[0].split(' ', 1)[1])
          assert {case['case'] for case in lifecycle_display} == {
              'move-tail', 'move-top', 'undo', 'redo'
          }
          for case in lifecycle_display:
              assert case['source_utf8_bytes'] >= 1 << 20
              assert case['request_to_bitmap_readback_ms'] >= case['request_to_oracle_paint_ms'] >= 0
              assert case['request_to_oracle_paint_ms'] >= case['request_to_action_return_ms'] >= 0
              assert case['under_50_ms'] == (case['request_to_bitmap_readback_ms'] < 50)
          records['lifecycle_display'] = lifecycle_display
          records['lifecycle_display_budget_failures'] = [case['case'] for case in lifecycle_display
                                                          if not case['under_50_ms']]
          print('LIFECYCLE-DISPLAY-BUDGET-VERDICT', json.dumps({
              'scope': 'programmatic mounted scroll and TextKit undo/redo to AppKit bitmap readback; real input-method composition is not measured',
              'under_50_ms': not records['lifecycle_display_budget_failures'],
              'failures': records['lifecycle_display_budget_failures']
          }, sort_keys=True))
          display_lines = [line for line in display_log.splitlines()
                           if line.startswith('VIEWPORT-DISPLAY-BUDGET ')]
          assert len(display_lines) == 1, len(display_lines)
          display = json.loads(display_lines[0].split(' ', 1)[1])
          assert len(display) == 10
          assert {case['case'] for case in display} == {
              'begin-word', 'middle-word', 'end-word', 'begin-delete',
              'word-boundary', 'unicode-replacement', 'crlf-replacement',
              'structural-newline', 'replacement-shrink', 'replacement-grow'
          }
          for case in display:
              assert case['source_utf8_bytes'] >= 1 << 20
              assert case['source_utf16_units'] <= 1_100_000
              assert case['display_non_background_samples'] > 2
              assert case['oracle_accent_pixel_samples'] > 0
              assert re.fullmatch(r'[0-9a-f]{64}', case['display_sha256'])
              assert case['input_to_display_readback_ms'] >= case['input_to_storage_return_ms'] >= 0
              assert case['input_to_display_readback_ms'] >= case['input_to_display_return_ms'] >= 0
              assert case['display_return_to_bitmap_readback_ms'] >= 0
              assert case['parse_request_to_publication_ms'] >= 0
              assert case['parse_attempts_requested'] >= 1
              assert case['parse_attempts_resolved'] >= 1
              assert case['configured_debounce_ms'] == 0
              assert case['pixel_changed'] or case['case'] in {'crlf-replacement', 'unicode-replacement'}
              assert case['under_50_ms'] == (case['input_to_display_readback_ms'] < 50)
          records['display'] = display
          records['display_budget_failures'] = [case['case'] for case in display
                                                if not case['under_50_ms']]
          print('DISPLAY-BUDGET-VERDICT', json.dumps({
              'scope': 'mounted package/editor store and AppKit display readback; parse interval includes queue and fallback; app-target event orchestration and timed movement/undo/redo/IME unmeasured',
              'under_50_ms': not records['display_budget_failures'],
              'failures': records['display_budget_failures']
          }, sort_keys=True))
          modes = {re.search(r'\bmode=(\w+)', case['raw']).group(1): case
                   for case in records['highlighter']}
          assert set(modes) == {'reduced', 'viewport'}
          assert all('selected=12 matched=12 local=12 full=1' in case['raw']
                     for case in [records['session'][0], modes['viewport']])
          (root / 'measurement.json').write_text(json.dumps(records, indent=2) + '\n')
          print(json.dumps(records, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mounted-viewport-release-measurement
          path: ${{ runner.temp }}/viewport-budget/
          if-no-files-found: error
