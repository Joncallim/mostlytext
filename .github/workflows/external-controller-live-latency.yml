name: External controller live latency

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/external-controller-live-latency.yml'
      - 'MacDown2/MacDown2Tests/ExternalFileControllerLiveLatencyTests.swift'
      - 'MacDown2/MacDown2/ExternalFileController.swift'
      - 'MacDown2/Packages/MacDownKit/Sources/FileCore/**'
      - 'MacDown2/Packages/MacDownKit/Package.resolved'
      - 'MacDown2/project.yml'
  workflow_dispatch:

concurrency:
  group: external-controller-latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-controller:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select macOS and deployment Xcode
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
          git rev-parse HEAD
      - name: Generate and pin the app project
        id: pin
        run: |
          set -euo pipefail
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          cd MacDown2
          xcodegen generate
          cd ..
          MacDown2/scripts/pin-xcode-package-versions.sh
      - name: Compile the actual app and test bundle
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration ${{ matrix.configuration }} ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) RELEASE_PREVIEW_PROBE' \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/external-controller-latency-app" \
            -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO build-for-testing
      - name: Measure real watcher to editor reconciliation
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/external-controller-latency"
          mkdir -p "$ROOT"
          export MOSTLYTEXT_CONTROLLER_LATENCY_OUTPUT="$ROOT/measurements"
          export TEST_RUNNER_MOSTLYTEXT_CONTROLLER_LATENCY_OUTPUT="$MOSTLYTEXT_CONTROLLER_LATENCY_OUTPUT"
          APP="$RUNNER_TEMP/external-controller-latency-app/Build/Products/${{ matrix.configuration }}/MacDown2.app/Contents/MacOS/MacDown2"
          python3 .github/scripts/run-owned-app-tests.py "$ROOT/diagnostics" "$APP" -- \
            xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
              -configuration ${{ matrix.configuration }} ENABLE_TESTABILITY=YES \
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) RELEASE_PREVIEW_PROBE' \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/external-controller-latency-app" \
              -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO \
              -resultBundlePath "$ROOT/latency.xcresult" \
              -only-testing:MacDown2Tests/ExternalFileControllerLiveLatencyTests test-without-building \
            | tee "$ROOT/latency.log"
          python3 - "$ROOT/measurements" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          for size in (1_000_000, 10_000_000):
              values = json.loads((root / f'{size}.json').read_text())
              assert values['bytes'] == size
              assert len(values['revision_sha256']) == 64
              for key in ('rename_to_first_event_ms', 'last_event_to_debounce_start_ms',
                          'actual_debounce_ms', 'debounce_end_to_model_and_editor_ms',
                          'rename_start_to_model_and_editor_ms'):
                  assert values[key] >= 0, (size, key, values[key])
              print(json.dumps(values, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-controller-latency-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/external-controller-latency/latency.log
            ${{ runner.temp }}/external-controller-latency/latency.xcresult/**
            ${{ runner.temp }}/external-controller-latency/measurements/*.json
            ${{ runner.temp }}/external-controller-latency/diagnostics/*.json
            ${{ runner.temp }}/external-controller-latency/diagnostics/*.log
            ${{ runner.temp }}/external-controller-latency/diagnostics/*.sample.txt
          if-no-files-found: warn
      - name: Verify immutable dependency locks
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: |
          set -euo pipefail
          MacDown2/scripts/pin-xcode-package-versions.sh --check
          git diff --exit-code -- MacDown2/Packages/MacDownKit/Package.resolved
