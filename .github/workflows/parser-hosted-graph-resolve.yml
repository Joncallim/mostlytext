name: Parser hosted graph resolution

permissions:
  contents: read

on:
  push:
    branches:
      - epic/05-parser-hosted-graph
    paths:
      - .github/scripts/resolve-parser-hosted-graph.py
      - .github/scripts/test-parser-hosted-graph.py
      - .github/workflows/parser-hosted-graph-resolve.yml

concurrency:
  group: parser-hosted-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check reviewed source and lock rules
        run: python3 .github/scripts/test-parser-hosted-graph.py
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Resolve exact published parser graph in temporary storage
        run: python3 .github/scripts/resolve-parser-hosted-graph.py "$RUNNER_TEMP/parser-hosted-graph"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-hosted-graph-first
          path: |
            ${{ runner.temp }}/parser-hosted-graph/receipt.json
            ${{ runner.temp }}/parser-hosted-graph/resolve.stdout
            ${{ runner.temp }}/parser-hosted-graph/resolve.stderr
            ${{ runner.temp }}/parser-hosted-graph/Packages/MacDownKit/Package.resolved
            ${{ runner.temp }}/parser-hosted-graph/Packages/MacDownKit/Package.swift
            ${{ runner.temp }}/parser-hosted-graph/Packages/TreeSitterMarkdown/Package.swift
          if-no-files-found: warn
