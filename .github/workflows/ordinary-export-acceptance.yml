name: Ordinary Release export panel acceptance
permissions:
  contents: read
on:
  pull_request:
    branches: [main, epic/08-preview-remediation-convergence]
    paths:
      - '.github/hosted-export-acceptance/**'
      - '.github/scripts/prepare-ordinary-export-acceptance.py'
      - '.github/scripts/run-ordinary-export-acceptance.py'
      - '.github/scripts/test-ordinary-export-acceptance.py'
      - '.github/workflows/ordinary-export-acceptance.yml'
  workflow_dispatch:
concurrency:
  group: ordinary-export-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guarded-ordinary-export:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard the disposable host and prepare the fixed export fixture
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-hosted-focus-guard.py
          python3 .github/scripts/test-ordinary-export-acceptance.py
          python3 .github/scripts/prepare-ordinary-export-acceptance.py "$RUNNER_TEMP/mostlytext-focus"
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Build and bind the ordinary locked ARM Release app and external validators
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- build 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/app-build.log"
          xcodebuild -quiet -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- -showBuildSettings -json > "$RUNNER_TEMP/mostlytext-focus/root-build-settings.json"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/scripts/native-cli-app-host.swift -o "$RUNNER_TEMP/mostlytext-focus/normal-app-host"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-public-focus/HostFacts.swift -o "$RUNNER_TEMP/mostlytext-focus/host-facts"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-export-acceptance/ValidatePDF.swift -o "$RUNNER_TEMP/mostlytext-focus/validate-export-pdf"
          python3 .github/scripts/prepare-ordinary-export-acceptance.py "$RUNNER_TEMP/mostlytext-focus" --bind-built
      - name: Build the separate benign control and cross-application export driver
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-focus/fixture/HostedPublicFocus.xcodeproj" -scheme HostedPublicFocus -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/control" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/control-build.log"
          python3 .github/scripts/prepare-ordinary-export-acceptance.py "$RUNNER_TEMP/mostlytext-focus" --admit-execution
      - name: Require real positive then ordinary Export cancel and HTML PDF saves
        run: |
          set -euo pipefail
          python3 .github/scripts/run-ordinary-export-acceptance.py "$RUNNER_TEMP/mostlytext-focus" 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/execution.log"
      - name: Preserve complete original first evidence including actual compiled inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-release-export-panel
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.log
            ${{ runner.temp }}/mostlytext-focus/positive-owned/**
            ${{ runner.temp }}/mostlytext-focus/export-owned/**
            ${{ runner.temp }}/mostlytext-focus/*.xcresult/**
            ${{ runner.temp }}/mostlytext-focus/documents/**
            ${{ runner.temp }}/mostlytext-focus/fixture/**
            ${{ runner.temp }}/mostlytext-focus/license-oracles/**
            ${{ runner.temp }}/mostlytext-focus/export-compiled-inputs/**
