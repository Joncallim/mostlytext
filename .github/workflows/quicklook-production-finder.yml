name: Production Markdown Quick Look Finder qualification

permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'MacDown2/MacDown2QuickLook/**'
      - 'MacDown2/MacDown2QuickLookWorker/**'
      - 'MacDown2/Packages/MacDownKit/Sources/QuickLookSource/**'
      - '.github/quicklook-production-probe/**'
      - '.github/workflows/quicklook-production-finder.yml'
  workflow_dispatch:
concurrency:
  group: quicklook-production-finder-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finder:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select macOS 26 and build the actual product
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          cd MacDown2
          xcodegen generate
          cd ..
          MacDown2/scripts/pin-xcode-package-versions.sh
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/production-quicklook/app-build" \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) QUICKLOOK_DERIVED_PROBE QUICKLOOK_DERIVED_MATH QUICKLOOK_DIAGRAM_PROBE' build \
            2>&1 | tee "$RUNNER_TEMP/production-quicklook-app-build.log"
      - name: Verify exact installed bundle and prepare separate Finder automation
        run: |
          set -euo pipefail
          built="$RUNNER_TEMP/production-quicklook/app-build/Build/Products/Release/MacDown2.app"
          app="$RUNNER_TEMP/production-quicklook/installed/MostlyText.app"
          mkdir -p "$(dirname "$app")"
          ditto "$built" "$app"
          provider="$app/Contents/PlugIns/MostlyTextQuickLook.appex"
          worker="$provider/Contents/XPCServices/MostlyTextQuickLookWorker.xpc"
          test -d "$app" && test -d "$provider" && test -d "$worker"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/codesign -d --entitlements :- "$provider" > "$RUNNER_TEMP/provider-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$worker" > "$RUNNER_TEMP/worker-entitlements.plist"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          provider = plistlib.loads((root / 'provider-entitlements.plist').read_bytes())
          worker = plistlib.loads((root / 'worker-entitlements.plist').read_bytes())
          assert provider == {
              'com.apple.security.app-sandbox': True,
              'com.apple.security.files.user-selected.read-only': True,
          }, provider
          assert worker == {'com.apple.security.app-sandbox': True}, worker
          PY
          cp -R .github/quicklook-production-probe "$RUNNER_TEMP/production-quicklook/fixture"
          cd "$RUNNER_TEMP/production-quicklook/fixture"
          xcodegen generate
          xcodebuild -project MostlyTextProductionFinderProbe.xcodeproj -scheme ProductionFinderProbe \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/production-quicklook/fixture-build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/production-quicklook-fixture-build.log"
      - name: Probe static math inside the exact sandboxed worker
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/production-quicklook/installed/MostlyText.app"
          worker="$app/Contents/PlugIns/MostlyTextQuickLook.appex/Contents/XPCServices/MostlyTextQuickLookWorker.xpc/Contents/MacOS/MostlyTextQuickLookWorker"
          test -x "$worker"
          WORKER="$worker" python3 - <<'PY'
          import os
          import resource
          import subprocess
          import time

          started = time.monotonic()
          result = subprocess.run(
              [os.environ['WORKER'], '--probe-math'],
              capture_output=True, text=True, timeout=6, check=False,
          )
          elapsed = time.monotonic() - started
          print('exit', result.returncode, 'wall_seconds', round(elapsed, 3))
          print('child_maxrss', resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)
          print('stdout', result.stdout.strip())
          print('stderr', result.stderr[-1000:])
          assert result.returncode == 0
          assert 'QUICKLOOK_SANDBOX_MATH_PROBE pngBytes=' in result.stdout
          assert elapsed < 6
          started = time.monotonic()
          result = subprocess.run(
              [os.environ['WORKER'], '--probe-shared-math'],
              capture_output=True, text=True, timeout=6, check=False,
          )
          elapsed = time.monotonic() - started
          print('shared_exit', result.returncode, 'wall_seconds', round(elapsed, 3))
          print('shared_child_maxrss', resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)
          print('shared_stdout', result.stdout.strip())
          print('shared_stderr', result.stderr[-1000:])
          assert result.returncode == 0
          assert 'QUICKLOOK_SHARED_MATH_PROBE htmlBytes=' in result.stdout
          assert elapsed < 6
          PY
      - name: Probe cold Mermaid inside the exact sandboxed worker
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/production-quicklook/installed/MostlyText.app"
          worker="$app/Contents/PlugIns/MostlyTextQuickLook.appex/Contents/XPCServices/MostlyTextQuickLookWorker.xpc/Contents/MacOS/MostlyTextQuickLookWorker"
          WORKER="$worker" python3 - <<'PY'
          import os
          import resource
          import subprocess
          import time

          started = time.monotonic()
          result = subprocess.run(
              [os.environ['WORKER'], '--probe-cold-mermaid'],
              capture_output=True, text=True, timeout=16, check=False,
          )
          elapsed = time.monotonic() - started
          print('mermaid_exit', result.returncode, 'wall_seconds', round(elapsed, 3))
          print('mermaid_child_maxrss', resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)
          print('mermaid_stdout', result.stdout.strip())
          print('mermaid_stderr', result.stderr[-1000:])
          assert result.returncode == 0
          assert 'QUICKLOOK_COLD_MERMAID_PROBE svgBytes=' in result.stdout
          PY
      - name: Register product and invoke genuine cold Finder
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/production-quicklook/installed/MostlyText.app"
          built="$RUNNER_TEMP/production-quicklook/app-build/Build/Products/Release/MacDown2.app"
          provider="$app/Contents/PlugIns/MostlyTextQuickLook.appex"
          cat > "$RUNNER_TEMP/mostlytext-production-quicklook.md" <<'MARKDOWN'
          # MOSTLYTEXT_PRODUCTION_QUICKLOOK_20261111

          | GFM_COLUMN_NAME | GFM_COLUMN_VALUE |
          | --- | --- |
          | one | ~~GFM_STRUCK_VALUE~~ |

          MATH_INLINE_MARKER $x^2$ MATH_AFTER_MARKER
          MARKDOWN
          ln -s "$RUNNER_TEMP/mostlytext-production-quicklook.md" "$RUNNER_TEMP/mostlytext-production-linked.md"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = "# QUICKLOOK_UTF16_BE_MARKER\r\n\r\n日本語 😀\r\n"
          (Path(os.environ['RUNNER_TEMP']) / 'mostlytext-production-utf16-be.md').write_bytes(
              b'\xfe\xff' + source.encode('utf-16-be')
          )
          PY
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u "$built"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$provider"
          pluginkit -e use -i app.mostlytext.MostlyText.QuickLook
          pluginkit -m -A -D -vv -i app.mostlytext.MostlyText.QuickLook | tee "$RUNNER_TEMP/production-quicklook-discovery.log"
          grep -Fq "Parent Bundle = $app" "$RUNNER_TEMP/production-quicklook-discovery.log"
          ! grep -Fq "Parent Bundle = $built" "$RUNNER_TEMP/production-quicklook-discovery.log"
          open -R "$RUNNER_TEMP/mostlytext-production-quicklook.md"
          python3 .github/scripts/run-owned-app-tests.py "$RUNNER_TEMP/production-quicklook/owned" \
            "$provider/Contents/MacOS/MostlyTextQuickLook" -- \
            xcodebuild -project "$RUNNER_TEMP/production-quicklook/fixture/MostlyTextProductionFinderProbe.xcodeproj" \
            -scheme ProductionFinderProbe -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/production-quicklook/fixture-build" \
            -resultBundlePath "$RUNNER_TEMP/production-quicklook/Finder.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/production-quicklook-finder.log"
      - name: Preserve first Finder outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-quicklook-finder
          path: |
            ${{ runner.temp }}/production-quicklook-*.log
            ${{ runner.temp }}/provider-entitlements.plist
            ${{ runner.temp }}/worker-entitlements.plist
            ${{ runner.temp }}/production-quicklook/owned/**
            ${{ runner.temp }}/production-quicklook/Finder.xcresult/**
