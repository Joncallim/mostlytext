name: Cold Finder Quick Look feasibility

permissions:
  contents: read
on:
  pull_request:
    branches: [main, master, integration-final]
    paths:
      - '.github/quicklook-reply-probe/**'
      - '.github/scripts/prepare-quicklook-reply-probe.py'
      - '.github/workflows/quicklook-reply-probe.yml'
  workflow_dispatch:
concurrency:
  group: quicklook-reply-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-finder:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select current Xcode and generate only the isolated fixture
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/prepare-quicklook-reply-probe.py "$RUNNER_TEMP/mostlytext-qlreply"
      - name: Compile and ad-hoc sign standalone container, provider and UI test
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-qlreply/fixture/QuickLookReplyProbe.xcodeproj" -scheme QuickLookReplyProbe -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-qlreply/build" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-qlreply/build.log"
          python3 .github/scripts/prepare-quicklook-reply-probe.py "$RUNNER_TEMP/mostlytext-qlreply" --verify-built
      - name: Register exact provider and reveal the generated file without launching the container
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mostlytext-qlreply/build/Build/Products/Release/QLReplyProbeContainer.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$app/Contents/PlugIns/QLReplyProbeProvider.appex"
          pluginkit -e use -i app.mostlytext.MostlyText.QuickLook
          pluginkit -m -A -D -vv -i app.mostlytext.MostlyText.QuickLook | tee "$RUNNER_TEMP/mostlytext-qlreply/discovery.log"
          open -R "$RUNNER_TEMP/mostlytext-qlreply/mostlytext-ql-reply-static.md"
      - name: Invoke actual cold Finder once and require visible provider content
        run: |
          set -euo pipefail
          provider="$RUNNER_TEMP/mostlytext-qlreply/build/Build/Products/Release/QLReplyProbeContainer.app/Contents/PlugIns/QLReplyProbeProvider.appex/Contents/MacOS/QLReplyProbeProvider"
          python3 .github/scripts/run-owned-app-tests.py "$RUNNER_TEMP/mostlytext-qlreply/owned" "$provider" -- xcodebuild -project "$RUNNER_TEMP/mostlytext-qlreply/fixture/QuickLookReplyProbe.xcodeproj" -scheme QuickLookReplyProbe -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-qlreply/build" -resultBundlePath "$RUNNER_TEMP/mostlytext-qlreply/Finder.xcresult" -parallel-testing-enabled NO -test-iterations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 test-without-building 2>&1 | tee "$RUNNER_TEMP/mostlytext-qlreply/finder.log"
      - name: Retain actual provider logs and post-test source verification
        if: always()
        run: |
          set +e
          /usr/bin/log show --last 12m --style json --predicate 'subsystem == "app.mostlytext.qlreplyprobe"' > "$RUNNER_TEMP/mostlytext-qlreply/provider-events.json" 2> "$RUNNER_TEMP/mostlytext-qlreply/provider-log-errors.txt"
          ps -axo pid=,uid=,comm= > "$RUNNER_TEMP/mostlytext-qlreply/processes-after.txt"
          python3 .github/scripts/prepare-quicklook-reply-probe.py "$RUNNER_TEMP/mostlytext-qlreply" --verify-finder
      - name: Preserve first complete feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-finder-quicklook-feasibility
          path: |
            ${{ runner.temp }}/mostlytext-qlreply/receipt.json
            ${{ runner.temp }}/mostlytext-qlreply/*.log
            ${{ runner.temp }}/mostlytext-qlreply/*.json
            ${{ runner.temp }}/mostlytext-qlreply/*.txt
            ${{ runner.temp }}/mostlytext-qlreply/*.plist
            ${{ runner.temp }}/mostlytext-qlreply/*.md
            ${{ runner.temp }}/mostlytext-qlreply/owned/**
            ${{ runner.temp }}/mostlytext-qlreply/Finder.xcresult/**
