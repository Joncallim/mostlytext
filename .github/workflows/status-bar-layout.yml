name: Theme model interleaving proof
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  focused-theme-model:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind a disposable hosted app-test environment
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          test ! -e /Users/jonathanlim
          test ! -e /Users/mostlytexttest
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Run only theme model interleavings
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/theme-model"
          git rev-parse HEAD > "$RUNNER_TEMP/theme-model/source-sha.txt"
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/theme-model/build" \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- \
            -only-testing:MacDown2Tests/ThemeCatalogModelTests test \
            2>&1 | tee "$RUNNER_TEMP/theme-model/test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-model-interleaving-proof
          path: ${{ runner.temp }}/theme-model/
          if-no-files-found: warn
