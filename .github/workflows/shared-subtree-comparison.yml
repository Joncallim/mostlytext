# Branch-local diagnostic entry only. Never merge this replacement workflow.
name: Fixed D2 Linux reference phase diagnosis only
permissions:
  contents: read
on:
  workflow_dispatch:
concurrency:
  group: d2-reference-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-frozen-reference:
    if: github.repository == 'Joncallim/mostlytext' && github.ref == 'refs/heads/epic/07-d2-reference-phase-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Execute one unchanged fixed-input reference with original bounds
        run: python3 .github/scripts/run-linux-d2-reference-diagnostic.py
      - name: Retain complete first Linux diagnostic without claiming native acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-d2-linux-reference-first
          path: ${{ runner.temp }}/mostlytext-d2-reference-diagnostic/**
