name: Native Quick Look reply retention proof
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/quicklook-retained-reply-probe/**'
      - '.github/scripts/run-quicklook-retained-reply-probe.py'
      - '.github/scripts/test-quicklook-retained-reply-probe.py'
      - '.github/workflows/quicklook-retained-reply-probe.yml'
  workflow_dispatch:
concurrency:
  group: quicklook-retained-reply-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-replies:
    if: github.repository == 'Joncallim/mostlytext' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select deployment-matching Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
      - name: Verify classification and owned lifecycle controls
        run: |
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-quicklook-retained-reply-probe.py
      - name: Execute actual original premature-refund counterexample and restored replies
        run: python3 .github/scripts/run-quicklook-retained-reply-probe.py
      - name: Preserve complete first source binary and owned native outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicklook-retained-reply-first
          path: ${{ runner.temp }}/quicklook-retained-reply/**
          if-no-files-found: warn
