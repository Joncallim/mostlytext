name: Real renderer Quick Look fallback observation

permissions:
  contents: read
on:
  pull_request:
    branches: [main, master, integration-final]
    paths:
      - '.github/quicklook-deadline-probe/**'
      - '.github/scripts/prepare-quicklook-deadline-probe.py'
      - '.github/scripts/test-quicklook-deadline-probe.py'
      - '.github/scripts/observe-quicklook-deadline.py'
      - '.github/scripts/run-quicklook-deadline-ui.py'
      - '.github/scripts/test-quicklook-deadline-observer.py'
      - '.github/workflows/quicklook-deadline-probe.yml'
  workflow_dispatch:
concurrency:
  group: quicklook-deadline-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-finder:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select current Xcode and generate only the isolated fixture
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-quicklook-deadline-probe.py
          python3 .github/scripts/test-quicklook-deadline-observer.py
          python3 .github/scripts/prepare-quicklook-deadline-probe.py "$RUNNER_TEMP/mostlytext-qldeadline"
      - name: Compile and ad-hoc sign standalone container, provider and UI test
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-qldeadline/fixture/QuickLookReplyProbe.xcodeproj" -scheme QuickLookReplyProbe -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-qldeadline/build" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-qldeadline/build.log"
          python3 .github/scripts/prepare-quicklook-deadline-probe.py "$RUNNER_TEMP/mostlytext-qldeadline" --seal-built
      - name: Register exact provider and reveal the generated file without launching the container
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mostlytext-qldeadline/build/Build/Products/Release/QLReplyProbeContainer.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$app/Contents/PlugIns/QLReplyProbeProvider.appex"
          pluginkit -e use -i app.mostlytext.MostlyText.QuickLook
          pluginkit -m -A -D -vv -i app.mostlytext.MostlyText.QuickLook | tee "$RUNNER_TEMP/mostlytext-qldeadline/discovery.log"
          open -R "$RUNNER_TEMP/mostlytext-qldeadline/mostlytext-ql-reply-static.md"
      - name: Execute actual cold positive and real D2 fallback observation once
        run: |
          set -euo pipefail
          python3 .github/scripts/run-quicklook-deadline-ui.py
      - name: Retain actual provider logs and post-test source verification
        if: always()
        run: |
          set +e
          /usr/bin/log show --last 12m --style json --predicate 'subsystem == "app.mostlytext.qldeadlineprobe"' > "$RUNNER_TEMP/mostlytext-qldeadline/provider-events.json" 2> "$RUNNER_TEMP/mostlytext-qldeadline/provider-log-errors.txt"
          /usr/bin/log show --last 12m --style json --predicate 'subsystem == "app.mostlytext.qldeadlineobserver"' > "$RUNNER_TEMP/mostlytext-qldeadline/observer-control-events.json" 2> "$RUNNER_TEMP/mostlytext-qldeadline/observer-control-log-errors.txt"
          ps -axo pid=,uid=,comm= > "$RUNNER_TEMP/mostlytext-qldeadline/processes-after.txt"
          python3 .github/scripts/prepare-quicklook-deadline-probe.py "$RUNNER_TEMP/mostlytext-qldeadline" --verify-finder
      - name: Preserve the first actual renderer and fallback result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-renderer-quicklook-deadline
          path: |
            ${{ runner.temp }}/mostlytext-qldeadline/receipt.json
            ${{ runner.temp }}/mostlytext-qldeadline/*.log
            ${{ runner.temp }}/mostlytext-qldeadline/*.json
            ${{ runner.temp }}/mostlytext-qldeadline/*.txt
            ${{ runner.temp }}/mostlytext-qldeadline/*.plist
            ${{ runner.temp }}/mostlytext-qldeadline/*.md
            ${{ runner.temp }}/mostlytext-qldeadline/compiled-inputs/**
            ${{ runner.temp }}/mostlytext-qldeadline/actual-ui-attachments/**
            ${{ runner.temp }}/mostlytext-qldeadline/fixture/**
            ${{ runner.temp }}/mostlytext-qldeadline/owned/**
            ${{ runner.temp }}/mostlytext-qldeadline/observer-journal/**
            ${{ runner.temp }}/mostlytext-qldeadline/Finder.xcresult/**
