name: Graphviz backend reproduction

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/graphviz-reproduction.yml'
      - 'compliance/tools/rebuild_graphviz_backend.py'
      - 'compliance/tools/verify_graphviz_rebuild.py'
      - 'compliance/tests/test_graphviz_rebuild.py'
      - 'compliance/evidence/graphviz-backend-reproduction/**'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare verified public inputs in runner scratch
        run: |
          python3 compliance/tools/rebuild_graphviz_backend.py prepare \
            --download --inputs "$RUNNER_TEMP/viz-inputs" --output "$RUNNER_TEMP/viz-rebuild"
      - name: Rebuild the unchanged recipe with no RUN network or shared cache
        run: |
          set -o pipefail
          docker pull --platform linux/amd64 emscripten/emsdk@sha256:c2ac84c26ee40ae2f2c5a15bd3f9e608d1959e1b37413fa7f08138046a188dc5
          docker image inspect emscripten/emsdk@sha256:c2ac84c26ee40ae2f2c5a15bd3f9e608d1959e1b37413fa7f08138046a188dc5 > "$RUNNER_TEMP/viz-rebuild/image-inspect.json"
          docker build --platform linux/amd64 --no-cache --network=none --progress=plain \
            --output "type=local,dest=$RUNNER_TEMP/viz-built" "$RUNNER_TEMP/viz-rebuild/context" \
            2>&1 | tee "$RUNNER_TEMP/viz-rebuild/build.log"
      - name: Compare the complete backend without loading JavaScript or WASM
        run: |
          python3 compliance/tools/rebuild_graphviz_backend.py compare \
            --output "$RUNNER_TEMP/viz-rebuild" --built "$RUNNER_TEMP/viz-built"
      - name: Retain receipts and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphviz-backend-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/viz-rebuild/prepared.json
            ${{ runner.temp }}/viz-rebuild/result.json
            ${{ runner.temp }}/viz-rebuild/image-inspect.json
            ${{ runner.temp }}/viz-rebuild/build.log
