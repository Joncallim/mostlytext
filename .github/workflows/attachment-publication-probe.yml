name: Attachment model publication controls
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'MacDown2/MacDown2Tests/TextualAttachmentPublicationTests.swift'
      - 'MacDown2/Packages/MacDownKit/Package.resolved'
      - '.github/scripts/run-attachment-publication-probe.py'
      - '.github/scripts/test-attachment-publication-pin-review.py'
      - '.github/scripts/run-owned-app-tests.py'
      - '.github/workflows/attachment-publication-probe.yml'
  workflow_dispatch:
concurrency:
  group: attachment-publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  attachment-model-controls:
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select deployment-matching Xcode and OS
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
      - name: Verify owned native command and exact pin review controls
        run: |
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-attachment-publication-pin-review.py
      - name: Execute identical original and candidate attachment model controls
        run: python3 .github/scripts/run-attachment-publication-probe.py "$RUNNER_TEMP/attachment-publication" ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-publication-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/attachment-publication/baseline/*.json
            ${{ runner.temp }}/attachment-publication/baseline/*.log
            ${{ runner.temp }}/attachment-publication/baseline/actual-*
            ${{ runner.temp }}/attachment-publication/baseline/probe-Package.swift
            ${{ runner.temp }}/attachment-publication/baseline/diagnostics/*
            ${{ runner.temp }}/attachment-publication/candidate/*.json
            ${{ runner.temp }}/attachment-publication/candidate/*.log
            ${{ runner.temp }}/attachment-publication/candidate/actual-*
            ${{ runner.temp }}/attachment-publication/candidate/probe-Package.swift
            ${{ runner.temp }}/attachment-publication/candidate/diagnostics/*
            ${{ runner.temp }}/attachment-publication/baseline-only.json
            ${{ runner.temp }}/attachment-publication/dependency-delta.json
          if-no-files-found: warn
