name: Pending Finder Quick Look cancellation observation

permissions:
  contents: read
on:
  pull_request:
    branches: [main, master, integration-final]
    paths:
      - '.github/quicklook-cancellation-probe/**'
      - '.github/scripts/prepare-quicklook-cancellation-probe.py'
      - '.github/scripts/test-quicklook-cancellation-probe.py'
      - '.github/workflows/quicklook-cancellation-probe.yml'
  workflow_dispatch:
concurrency:
  group: quicklook-cancellation-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-finder:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select current Xcode and generate only the isolated fixture
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-quicklook-cancellation-probe.py
          python3 .github/scripts/prepare-quicklook-cancellation-probe.py "$RUNNER_TEMP/mostlytext-qlcancel"
      - name: Compile and ad-hoc sign standalone container, provider and UI test
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-qlcancel/fixture/QuickLookReplyProbe.xcodeproj" -scheme QuickLookReplyProbe -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-qlcancel/build" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-qlcancel/build.log"
          python3 .github/scripts/prepare-quicklook-cancellation-probe.py "$RUNNER_TEMP/mostlytext-qlcancel" --seal-built
      - name: Register exact provider and reveal the generated file without launching the container
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mostlytext-qlcancel/build/Build/Products/Release/QLReplyProbeContainer.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          pluginkit -a "$app/Contents/PlugIns/QLReplyProbeProvider.appex"
          pluginkit -e use -i app.mostlytext.MostlyText.QuickLook
          pluginkit -m -A -D -vv -i app.mostlytext.MostlyText.QuickLook | tee "$RUNNER_TEMP/mostlytext-qlcancel/discovery.log"
          open -R "$RUNNER_TEMP/mostlytext-qlcancel/mostlytext-ql-reply-static.md"
      - name: Execute actual cold positive and real pending Finder closure once
        run: |
          set -euo pipefail
          provider="$RUNNER_TEMP/mostlytext-qlcancel/build/Build/Products/Release/QLReplyProbeContainer.app/Contents/PlugIns/QLReplyProbeProvider.appex/Contents/MacOS/QLReplyProbeProvider"
          python3 .github/scripts/run-owned-app-tests.py "$RUNNER_TEMP/mostlytext-qlcancel/owned" "$provider" -- xcodebuild -project "$RUNNER_TEMP/mostlytext-qlcancel/fixture/QuickLookReplyProbe.xcodeproj" -scheme QuickLookReplyProbe -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-qlcancel/build" -resultBundlePath "$RUNNER_TEMP/mostlytext-qlcancel/Finder.xcresult" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 test-without-building 2>&1 | tee "$RUNNER_TEMP/mostlytext-qlcancel/finder.log"
      - name: Retain actual provider logs and post-test source verification
        if: always()
        run: |
          set +e
          /usr/bin/log show --last 12m --style json --predicate 'subsystem == "app.mostlytext.qlcancelprobe"' > "$RUNNER_TEMP/mostlytext-qlcancel/provider-events.json" 2> "$RUNNER_TEMP/mostlytext-qlcancel/provider-log-errors.txt"
          ps -axo pid=,uid=,comm= > "$RUNNER_TEMP/mostlytext-qlcancel/processes-after.txt"
          python3 .github/scripts/prepare-quicklook-cancellation-probe.py "$RUNNER_TEMP/mostlytext-qlcancel" --verify-finder
      - name: Preserve every first actual pending closure result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-finder-quicklook-cancellation
          path: |
            ${{ runner.temp }}/mostlytext-qlcancel/receipt.json
            ${{ runner.temp }}/mostlytext-qlcancel/*.log
            ${{ runner.temp }}/mostlytext-qlcancel/*.json
            ${{ runner.temp }}/mostlytext-qlcancel/*.txt
            ${{ runner.temp }}/mostlytext-qlcancel/*.plist
            ${{ runner.temp }}/mostlytext-qlcancel/*.md
            ${{ runner.temp }}/mostlytext-qlcancel/compiled-inputs/**
            ${{ runner.temp }}/mostlytext-qlcancel/actual-ui-attachments/**
            ${{ runner.temp }}/mostlytext-qlcancel/fixture/**
            ${{ runner.temp }}/mostlytext-qlcancel/owned/**
            ${{ runner.temp }}/mostlytext-qlcancel/Finder.xcresult/**
