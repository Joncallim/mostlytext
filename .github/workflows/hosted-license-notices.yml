name: Hosted normal licence-window acceptance
permissions:
  contents: read
on:
  pull_request:
    branches: [main, master, integration-final]
    paths:
      - 'MacDown2/MacDown2/AppDelegate.swift'
      - 'MacDown2/MacDown2/MacDown2App.swift'
      - 'MacDown2/MacDown2/StartupPlaceholderView.swift'
      - '.github/hosted-public-focus/**'
      - '.github/scripts/prepare-hosted-public-focus.py'
      - '.github/scripts/run-hosted-public-focus.py'
      - '.github/scripts/test-hosted-focus-guard.py'
      - '.github/workflows/hosted-public-focus.yml'
      - '.github/workflows/hosted-license-notices.yml'
      - '.github/scripts/test-hosted-license-notices.py'
      - 'LICENSE'
      - 'compliance/generated/THIRD_PARTY_NOTICES.md'
      - 'MacDown2/MacDown2/LicenseNotices*.swift'
      - 'MacDown2/MacDown2/AboutCommands.swift'
  workflow_dispatch:
concurrency:
  group: hosted-license-notices-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guarded-license-notices:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Xcode and prepare only the trusted hosted fixture
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-hosted-focus-guard.py
          python3 .github/scripts/test-hosted-license-notices.py
          python3 .github/scripts/prepare-hosted-public-focus.py "$RUNNER_TEMP/mostlytext-focus"
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Build and ad-hoc seal the ordinary locked Release app independently
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- build 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/app-build.log"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/scripts/native-cli-app-host.swift -o "$RUNNER_TEMP/mostlytext-focus/normal-app-host"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-public-focus/HostFacts.swift -o "$RUNNER_TEMP/mostlytext-focus/host-facts"
          python3 .github/scripts/prepare-hosted-public-focus.py "$RUNNER_TEMP/mostlytext-focus" --bind-built
      - name: Build only the independent benign control and cross-application driver
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-focus/fixture/HostedPublicFocus.xcodeproj" -scheme HostedPublicFocus -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/control" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/control-build.log"
      - name: Gate normal launch on the actual positive control then exercise public focus once
        run: |
          set -euo pipefail
          python3 .github/scripts/run-hosted-public-focus.py "$RUNNER_TEMP/mostlytext-focus" --license-notices-probe 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/execution.log"
      - name: Preserve complete first engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-normal-license-notices
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.log
            ${{ runner.temp }}/mostlytext-focus/positive-owned/**
            ${{ runner.temp }}/mostlytext-focus/focus-owned/**
            ${{ runner.temp }}/mostlytext-focus/*.xcresult/**
            ${{ runner.temp }}/mostlytext-focus/documents/**
            ${{ runner.temp }}/mostlytext-focus/license-oracles/**
            ${{ runner.temp }}/mostlytext-focus/fixture/**
