name: Original native tabs and conflict-close engineering
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/run-hosted-critical-journey.py'
      - '.github/workflows/hosted-critical-journeys.yml'
      - 'MacDown2/MacDown2UITests/TabLifecycleUITests.swift'
      - 'MacDown2/MacDown2UITests/ExternalFileChangesUITests.swift'
      - '.github/hosted-original-focus/**'
      - '.github/scripts/run-hosted-original-focus.py'
      - '.github/workflows/hosted-original-focus.yml'
      - '.github/scripts/check-native-ui-required-cases.py'
      - '.github/scripts/test-native-ui-required-cases.py'
      - 'planning/downstream/native-ui-required-cases.json'
      - '.github/scripts/prepare-hosted-public-focus.py'
      - '.github/scripts/run-owned-app-tests.py'
      - '.github/scripts/test-hosted-focus-guard.py'
      - '.github/scripts/test-run-owned-app-tests.py'
      - '.github/hosted-public-focus/Control/**'
      - '.github/hosted-public-focus/Control-Info.plist'
      - '.github/hosted-public-focus/project.yml'
      - '.github/hosted-public-focus/HostFacts.swift'
concurrency:
  group: hosted-critical-journeys-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-critical-journey:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        journey: [native-tabs-dirty-close, native-tabs-quick-open, external-conflict-close]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare guarded private source controls
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-hosted-focus-guard.py
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-native-ui-required-cases.py
          python3 .github/scripts/check-native-ui-required-cases.py
          python3 .github/scripts/run-hosted-critical-journey.py prepare --journey "${{ matrix.journey }}"
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Build intentionally ordinary Debug app and original test source
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Debug -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/app-build.log"
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Debug -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- -showBuildSettings -json | python3 -c 'import json,sys; values=json.load(sys.stdin); keys=["CONFIGURATION","SWIFT_ACTIVE_COMPILATION_CONDITIONS","TARGET_BUILD_DIR","FULL_PRODUCT_NAME","PRODUCT_BUNDLE_IDENTIFIER","SWIFT_VERSION","SWIFT_STRICT_CONCURRENCY","SDK_VERSION","CLANG_ENABLE_CODE_COVERAGE"]; json.dump([{"target":v["target"],"buildSettings":{k:v["buildSettings"].get(k) for k in keys}} for v in values],sys.stdout,indent=2)' > "$RUNNER_TEMP/mostlytext-focus/root-build-settings.json"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-public-focus/HostFacts.swift -o "$RUNNER_TEMP/mostlytext-focus/host-facts"
      - name: Build only private harmless input control
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-focus/fixture/HostedPublicFocus.xcodeproj" -scheme HostedPublicFocus -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/control" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/control-build.log"
      - name: Require actual positive control then exactly one original named case
        run: |
          set -euo pipefail
          python3 .github/scripts/run-hosted-critical-journey.py execute --journey "${{ matrix.journey }}" 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/execution.log"
      - name: Preserve the original complete engineering outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-critical-${{ matrix.journey }}
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.txt
            ${{ runner.temp }}/mostlytext-focus/*.log
            ${{ runner.temp }}/mostlytext-focus/*-owned/**
            ${{ runner.temp }}/mostlytext-focus/*.xcresult/**
            ${{ runner.temp }}/mostlytext-focus/fixture/**
            ${{ runner.temp }}/mostlytext-focus/app/Build/Products/*.xctestrun
            ${{ runner.temp }}/mostlytext-focus/test-inputs/**
