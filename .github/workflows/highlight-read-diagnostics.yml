name: Controlled highlighting replay and original-read diagnostics

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'MacDown2/Packages/MacDownKit/Sources/Highlighting/**'
      - 'MacDown2/Packages/MacDownKit/Sources/EditorCore/**'
      - 'MacDown2/Packages/MacDownKit/Tests/HighlightingTests/**'
      - 'MacDown2/Packages/MacDownKit/Package.resolved'
      - '.github/scripts/run-highlight-read-diagnostics.py'
      - '.github/scripts/record_highlight_read.py'
      - '.github/scripts/test-highlight-replay-result.py'
      - '.github/workflows/highlight-read-diagnostics.yml'

concurrency:
  group: highlight-read-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-highlighting:
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select deployment-matching Xcode and OS
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
      - name: Verify owned diagnostic lifecycle controls
        run: |
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-highlight-replay-result.py
      - name: Verify strict native replay and classify the unchanged original assertion
        run: python3 .github/scripts/run-highlight-read-diagnostics.py "$RUNNER_TEMP/highlight-read-diagnostic" --configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-highlight-read-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/highlight-read-diagnostic/receipt.json
            ${{ runner.temp }}/highlight-read-diagnostic/assertion-frame.json
            ${{ runner.temp }}/highlight-read-diagnostic/compile.log
            ${{ runner.temp }}/highlight-read-diagnostic/probe.log
            ${{ runner.temp }}/highlight-read-diagnostic/direct.log
            ${{ runner.temp }}/highlight-read-diagnostic/commands.lldb
            ${{ runner.temp }}/highlight-read-diagnostic/*-diagnostics/*.json
            ${{ runner.temp }}/highlight-read-diagnostic/*-diagnostics/*.sample.txt
            ${{ runner.temp }}/highlight-read-diagnostic/*-diagnostics/*.log
          if-no-files-found: warn
