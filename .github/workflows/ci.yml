name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths: ['MacDown2/**', '.github/workflows/ci.yml', '.github/scripts/*owned*package*.py']
  pull_request:
    branches: [main, master, integration-final]
    paths: ['MacDown2/**', '.github/workflows/ci.yml', '.github/scripts/*owned*package*.py']
  workflow_dispatch:
    inputs:
      runner:
        description: macOS 26 architecture for this complete validation run
        type: choice
        required: true
        default: macos-26
        options:
          - macos-26
          - macos-26-intel

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/epic/05-parser-hosted-graph'
    # Keep ARM as the default. An explicit dispatch can exercise the same
    # complete checks on supported Intel macOS 26 during ARM capacity outages.
    # Never use an older OS to execute macOS-26-deployment binaries.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          # Runner images can ship an untrusted tap (e.g. aws/tap) that makes
          # Homebrew refuse to install; untap defensively.
          brew untap aws/tap 2>/dev/null || true
          brew install swiftlint
          # SwiftFormat's unpinned Homebrew formula can change formatting rules
          # without a source change. Use the version that formatted this tree.
          curl -fsSLo "$RUNNER_TEMP/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          echo '385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb  '"$RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -p "$RUNNER_TEMP/swiftformat.zip" swiftformat > "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat"
      - name: SwiftFormat (lint)
        run: '"$RUNNER_TEMP/swiftformat" --lint MacDown2'
      - name: SwiftLint (strict)
        run: swiftlint lint --strict MacDown2

  build-and-test:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/epic/05-parser-hosted-graph'
    # Both dispatch choices match the deployment OS and run every check.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 60
    env:
      PR535_DIAGNOSTICS: ${{ github.repository == 'Joncallim/macdown_2' && github.event_name == 'pull_request' && github.event.number == 535 && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Select Xcode 26 FIRST so every subsequent step (swift build/test,
      # xcodegen, xcodebuild) uses the same Swift 6.2+ toolchain.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
          uname -m
          if [ "$PR535_DIAGNOSTICS" = true ]; then
            test "$(xcodebuild -version | head -1)" = 'Xcode 26.0.1'
          fi
      - name: Install XcodeGen
        run: |
          # Runner images can ship an untrusted tap (e.g. aws/tap) that makes
          # Homebrew refuse to install; untap defensively.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Prepare bounded package crash diagnostics
        if: env.PR535_DIAGNOSTICS == 'true'
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_MERGE: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/pr535-package-diagnostics"
          mkdir -p "$diagnostics"
          touch "$diagnostics/start-marker"
          {
            printf 'event_head=%s\nevent_base=%s\nevent_merge=%s\nevent_sha=%s\nrun=%s\nattempt=%s\n' \
              "$EVENT_HEAD" "$EVENT_BASE" "$EVENT_MERGE" "$EVENT_SHA" "$RUN_ID" "$RUN_ATTEMPT"
            printf 'actual_checkout=%s\n' "$(git rev-parse HEAD)"
            git show -s --format='checkout_parents=%P' HEAD
            xcode-select -p
            xcodebuild -version
            swift --version
            sw_vers
            shasum -a 256 MacDown2/Packages/MacDownKit/Package.resolved
          } > "$diagnostics/identity.txt"
          cat > "$diagnostics/diagnostic.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          root = Path(os.environ['RUNNER_TEMP']) / 'pr535-package-diagnostics'
          mode = sys.argv[1]
          if mode == 'log':
              # Drain after the cap to avoid changing the test's execution via SIGPIPE.
              cap = 8 * 1024 * 1024
              count = 0
              with (root / sys.argv[2]).open('wb') as log:
                  while chunk := sys.stdin.buffer.read1(65536):
                      kept = chunk[:max(0, cap - count)]
                      log.write(kept)
                      sys.stdout.buffer.write(kept)
                      sys.stdout.buffer.flush()
                      count += len(chunk)
              sys.exit(74 if count > cap else 0)
          elif mode == 'run':
              script = r'''
          set -euo pipefail
          capture() {
            label="$1"
            shift
            set +e
            swift "$@" 2>&1 | python3 "$RUNNER_TEMP/pr535-package-diagnostics/diagnostic.py" log "$label.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s swift=%s log=%s\n' "$label" "${codes[0]}" "${codes[1]}" >> "$RUNNER_TEMP/pr535-package-diagnostics/status.txt"
            if [ "${codes[0]}" -ne 0 ]; then return "${codes[0]}"; fi
            return "${codes[1]}"
          }
          capture build build --force-resolved-versions
          capture test test --no-parallel --force-resolved-versions
          '''
              process = subprocess.Popen(['bash', '-c', script], start_new_session=True)
              known = {process.pid}
              deadline = time.monotonic() + 1200
              result = 1
              try:
                  with (root / 'processes.tsv').open('w') as history:
                      while True:
                          rows = subprocess.check_output(
                              ['ps', '-axo', 'pid=,ppid=,pgid=,comm='], text=True
                          ).splitlines()
                          parsed = [row.strip().split(None, 3) for row in rows]
                          for _ in range(4):
                              for row in parsed:
                                  if len(row) == 4 and (int(row[1]) in known or int(row[2]) == process.pid):
                                      pid = int(row[0])
                                      if pid not in known:
                                          if history.tell() + len(row[3].encode()) + 64 > 1024 * 1024:
                                              raise RuntimeError('process history exceeded 1 MiB')
                                          history.write('\t'.join(row) + '\n')
                                          history.flush()
                                          known.add(pid)
                          result = process.poll()
                          if result is not None:
                              break
                          if time.monotonic() >= deadline:
                              result = 124
                              break
                          time.sleep(0.25)
              finally:
                  # Terminate only this supervisor's dedicated process group on timeout/error.
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      def live_group():
                          rows = subprocess.check_output(['ps', '-axo', 'pgid=,stat='], text=True).splitlines()
                          return any(int(row.split()[0]) == process.pid and not row.split()[1].startswith('Z') for row in rows)
                      grace = time.monotonic() + 3
                      while live_group() and time.monotonic() < grace:
                          time.sleep(0.1)
                      if live_group():
                          os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
              (root / 'supervisor-exit.txt').write_text(str(result) + '\n')
              sys.exit(result if result >= 0 else 128 - result)
          elif mode == 'collect':
              time.sleep(5)  # Allow crash reporting to finish writing the fresh report.
              marker = (root / 'start-marker').stat().st_mtime
              pids = set()
              for line in (root / 'processes.tsv').read_text().splitlines() if (root / 'processes.tsv').exists() else []:
                  fields = line.split('\t', 3)
                  if len(fields) == 4 and Path(fields[3]).name == 'MacDownKitPackageTests':
                      pids.add(int(fields[0]))
              destination = root / 'crashes'
              destination.mkdir(exist_ok=True)
              used = 0
              report_dir = Path.home() / 'Library/Logs/DiagnosticReports'
              decoder = json.JSONDecoder()
              with (root / 'collection.txt').open('w') as record:
                  record.write('observed_test_pids=' + ','.join(map(str, sorted(pids))) + '\n')
                  if report_dir.exists():
                      for report in sorted(report_dir.glob('MacDownKitPackageTests*.ips')):
                          if record.tell() > 1024 * 1024:
                              raise RuntimeError('collection log exceeded 1 MiB')
                          if report.is_symlink() or report.stat().st_mtime < marker:
                              continue
                          size = report.stat().st_size
                          if size > 1024 * 1024 or used + size > 8 * 1024 * 1024:
                              record.write('size_cap_skipped=' + report.name + '\n')
                              continue
                          with report.open('rb') as source:
                              raw = source.read(1024 * 1024 + 1)
                          if len(raw) > 1024 * 1024 or used + len(raw) > 8 * 1024 * 1024:
                              record.write('size_cap_skipped=' + report.name + '\n')
                              continue
                          text = raw.decode('utf-8')
                          header, end = decoder.raw_decode(text.lstrip())
                          body, _ = decoder.raw_decode(text.lstrip()[end:].lstrip())
                          if body.get('pid') not in pids or body.get('procName') != 'MacDownKitPackageTests':
                              continue
                          (destination / report.name).write_bytes(raw)
                          used += len(raw)
                          record.write('collected=' + report.name + '\n')
                  record.write('collected_bytes=' + str(used) + '\n')
          else:
              raise SystemExit('unknown diagnostic mode')
          PY
      - name: Shared math syntax (Foundation only)
        run: |
          swift test --package-path MacDown2/Packages/MathSyntax --force-resolved-versions
          swift test --package-path MacDown2/Packages/MathSyntax -c release --force-resolved-versions
      - name: Package build + tests
        working-directory: MacDown2/Packages/MacDownKit
        # --force-resolved-versions builds exactly the revisions in the
        # committed Package.resolved and fails if it is missing, stale or
        # unresolvable, instead of re-resolving. SwiftTreeSitter tracks
        # `branch: "main"`, so re-resolving could silently change it (#148 LC-05).
        run: |
          if [ "$PR535_DIAGNOSTICS" = true ]; then
            exec python3 "$RUNNER_TEMP/pr535-package-diagnostics/diagnostic.py" run
          fi
          swift build --force-resolved-versions
          # Build all tests once. Darwin loads Swift Testing bundles inside
          # swiftpm-testing-helper: signing a bundle cannot give that process
          # an identity. Keep installed Xcode untouched and sign an owned copy.
          swift build --build-tests --force-resolved-versions
          test_bundle="$(swift build --show-bin-path --force-resolved-versions)/MacDownKitPackageTests.xctest"
          test_host="$test_bundle/Contents/MacOS/MacDownKitPackageTests"
          test -f "$test_host"
          developer="$(xcode-select -p)"
          helper="$developer/Toolchains/XcodeDefault.xctoolchain/usr/libexec/swift/pm/swiftpm-testing-helper"
          owned_helper="$RUNNER_TEMP/owned-swiftpm-testing-helper"
          cp "$helper" "$owned_helper"
          cmp "$helper" "$owned_helper"
          shasum -a 256 "$helper"
          codesign --force --sign - "$owned_helper"
          codesign --verify --strict "$owned_helper"
          shasum -a 256 "$helper" "$test_host" "$owned_helper" > "$RUNNER_TEMP/package-test-host.sha256"
          frameworks="$developer/Platforms/MacOSX.platform/Developer/Library/Frameworks"
          test -d "$frameworks/Testing.framework"
          # Keep both frameworks and all assertions. SwiftPM runs XCTest;
          # the copied, identified helper runs every Swift Testing case.
          # Existing timing ceilings and serial execution remain unchanged.
          python3 "$GITHUB_WORKSPACE/.github/scripts/test_owned_package_reports.py"
          swift test --skip-build --disable-swift-testing --no-parallel --force-resolved-versions
          env DYLD_FRAMEWORK_PATH="$frameworks" python3 "$GITHUB_WORKSPACE/.github/scripts/run-owned-package-tests.py" \
            "$RUNNER_TEMP/owned-package-test-result" "$owned_helper" \
            --test-bundle-path "$test_host" --testing-library swift-testing --no-parallel
          codesign --verify --strict "$owned_helper"
          shasum -a 256 -c "$RUNNER_TEMP/package-test-host.sha256"
      - name: Upload owned package host identity and fresh crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-package-test-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owned-package-test-result
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect fresh package test crash reports
        if: ${{ always() && env.PR535_DIAGNOSTICS == 'true' }}
        run: |
          if [ -f "$RUNNER_TEMP/pr535-package-diagnostics/diagnostic.py" ]; then
            python3 "$RUNNER_TEMP/pr535-package-diagnostics/diagnostic.py" collect
          fi
      - name: Upload bounded package crash diagnostics
        if: ${{ always() && env.PR535_DIAGNOSTICS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr535-package-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr535-package-diagnostics
          retention-days: 7
          if-no-files-found: error
      - name: Generate Xcode project
        working-directory: MacDown2
        run: xcodegen generate
      - name: Pin Xcode to the committed package versions
        id: pin-xcode-packages
        # The generated project is git-ignored, so copy MacDownKit's committed
        # lock file into its workspace. Every xcodebuild below passes
        # -onlyUsePackageVersionsFromResolvedFile. Xcode ignores that flag and
        # re-resolves if the file is absent, so the copy is checked again after
        # the builds.
        run: MacDown2/scripts/pin-xcode-package-versions.sh
      - name: Build app + CLI
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MostlyTextCLI -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
      - name: Build app + CLI (Release)
        # EPIC-14B second-adversarial-pass finding #6: the DoD evidence
        # claimed "app/CLI/Release all green" without this ever actually
        # running anywhere — the step above only ever built Debug. A
        # Release-only compile error (e.g. an `#if DEBUG`-gated path, or a
        # warning that is only promoted to an error under Release's
        # different optimization/whole-module settings) would not fail a
        # PR without this.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile SWIFT_EMIT_LOC_STRINGS=YES build
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MostlyTextCLI -configuration Release \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile SWIFT_EMIT_LOC_STRINGS=YES build
      - name: Verify compiled document metadata and embedded CLI
        run: |
          python3 MacDown2/scripts/test-document-metadata.py
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile -showBuildSettings -json \
            > "$RUNNER_TEMP/document-build-settings.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          records = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'document-build-settings.json').read_text())
          settings = next(row['buildSettings'] for row in records if row['target'] == 'MacDown2')
          app = pathlib.Path(settings['TARGET_BUILD_DIR']) / settings['FULL_PRODUCT_NAME']
          command = pathlib.Path(settings['BUILT_PRODUCTS_DIR']) / 'mostlytext'
          subprocess.run(['python3', 'MacDown2/scripts/verify-document-metadata.py', '--app', str(app),
                          '--guide', 'docs/INSTALLATION_AND_MIGRATION.md', '--standalone-cli', str(command)], check=True)
          subprocess.run(['python3', 'planning/downstream/tools/compiled_string_coverage.py',
                          '--extraction-dir', settings['OBJROOT'], '--configuration', settings['CONFIGURATION'], '--output',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'compiled-string-coverage.json')], check=True)
          PY
      - name: Build for testing (app + UI tests; UI tests run requires macOS 26+ GUI)
        # -enableCodeCoverage NO: documented in planning/epic-10-implementation.md
        # ("Local build-for-testing coverage quirk"). Xcode 26's build-for-testing
        # injects -fprofile-instr-generate into every target for the scheme's Test
        # action regardless of the scheme's own coverage setting, and the profiling
        # runtime never gets linked into the pure-C SwiftPM targets (tree-sitter,
        # cmark, Yams), so linking fails with an undefined ___llvm_profile_runtime
        # symbol. That epic's evidence table assumed CI's macos-26 runner might not
        # hit this; it reproducibly does, so the flag now applies here too, not just
        # locally. No coverage report is consumed anywhere in this pipeline.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO build-for-testing
      - name: Run MacDown2Tests (non-UI app-target tests)
        # EPIC-14B adversarial-review finding #12: app-target adapter/undo/
        # lifecycle tests (e.g. TextFilterCoordinatorTests) previously had
        # only build-for-testing evidence in CI — a real regression in them
        # would not fail a PR. -parallel-testing-enabled NO matches the local
        # verification convention: this suite's process/save-queue/timing
        # tests are load-sensitive and flake under XCTest's default
        # parallelism, on this runner as much as locally.
        # MacDown2UITests is deliberately excluded: it needs an interactive
        # macOS 26 GUI session this headless runner does not provide, and
        # stays build-only (previous step) with its evidence tracked as
        # manual/unverified in the release ledger, not run here.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO -parallel-testing-enabled NO \
            -only-testing:MacDown2Tests test-without-building
      - name: Verify every build used the committed package versions
        # Runs after all xcodebuild calls, including when a later build or test
        # step failed, so a removed or rewritten lock is always reported once the
        # pin step has run.
        if: ${{ !cancelled() && steps.pin-xcode-packages.outcome == 'success' }}
        run: |
          MacDown2/scripts/pin-xcode-package-versions.sh --check
          git diff --exit-code -- MacDown2/Packages/MacDownKit/Package.resolved

  parser-package-qualification:
    # CI already exists on the default branch, so a manual run can select the
    # isolated parser ref without installing another workflow on main.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Joncallim/mostlytext' && github.ref == 'refs/heads/epic/05-parser-hosted-graph'
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select exact deployment toolchain
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          XCODE=/Applications/Xcode_26.6.app
          test -d "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: parser-hosted-graph-first
          run-id: 42487278217
          repository: Joncallim/mostlytext
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/parser-package-qualification/graph
      - name: Resolve and test exact fork and staged app packages
        run: python3 .github/scripts/qualify-parser-hosted-packages.py "$RUNNER_TEMP/parser-package-qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-hosted-package-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/parser-package-qualification/receipt.json
            ${{ runner.temp }}/parser-package-qualification/*.log
            ${{ runner.temp }}/parser-package-qualification/remote-sources.json
            ${{ runner.temp }}/parser-package-qualification/graph/receipt.json
            ${{ runner.temp }}/parser-package-qualification/graph/resolve.stdout
            ${{ runner.temp }}/parser-package-qualification/graph/resolve.stderr
            ${{ runner.temp }}/parser-package-qualification/graph/Packages/MacDownKit/Package.resolved
            ${{ runner.temp }}/parser-package-qualification/graph/Packages/MacDownKit/Package.swift
            ${{ runner.temp }}/parser-package-qualification/graph/Packages/TreeSitterMarkdown/Package.swift
            ${{ runner.temp }}/parser-package-qualification/forks/swifttreesitter/Package.swift
            ${{ runner.temp }}/parser-package-qualification/forks/swifttreesitter/Package.resolved
            ${{ runner.temp }}/parser-package-qualification/forks/neon/Package.swift
            ${{ runner.temp }}/parser-package-qualification/forks/neon/Package.resolved
            ${{ runner.temp }}/parser-package-qualification/checkout/MacDown2/Packages/MacDownKit/Package.swift
            ${{ runner.temp }}/parser-package-qualification/checkout/MacDown2/Packages/MacDownKit/Package.resolved
            ${{ runner.temp }}/parser-package-qualification/checkout/MacDown2/Packages/TreeSitterMarkdown/Package.swift
            ${{ runner.temp }}/parser-package-qualification/owned-package-test-result/**
          if-no-files-found: warn
