name: Read exact failed ordinary export PDF without launching the app
permissions:
  contents: read
on:
  workflow_dispatch:
concurrency:
  group: ordinary-export-pdf-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-original-pdf:
    if: github.repository == 'Joncallim/mostlytext'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select matching SDK and admit only exact original failed canary bytes
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
          python3 .github/scripts/test-actual-export-pdf-readback.py
          python3 .github/scripts/read-actual-export-pdf.py prepare
      - name: Compile unchanged original guard and read-only diagnostic only
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-export-acceptance/ValidatePDF.swift -o "$RUNNER_TEMP/mostlytext-focus/validate-export-pdf"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-export-acceptance/ReadActualPDF.swift -o "$RUNNER_TEMP/mostlytext-focus/read-actual-export-pdf"
      - name: Retain actual original failed guard and PDFKit predicates/text/clipped-page rasters
        run: python3 .github/scripts/read-actual-export-pdf.py observe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-original-pdf-readback
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.png
            ${{ runner.temp }}/mostlytext-focus/documents/ordinary-export.pdf
          if-no-files-found: error
