name: Private Preview Textual selection A/B

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: private-preview-selection-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mounted-copy:
    strategy:
      fail-fast: false
      matrix:
        variant: [old, new]
    runs-on: macos-26
    timeout-minutes: 75
    env:
      MOSTLYTEXT_PREVIEW_RESOURCE_TRACE: "1"
      TEST_RUNNER_MOSTLYTEXT_PREVIEW_RESOURCE_TRACE: "1"
      MOSTLYTEXT_SELECTION_AB_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select deployment-matching Apple Silicon Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
          git rev-parse HEAD
      - name: Guard host and prepare the immutable Textual variant
        run: python3 .github/scripts/preview-selection-ab.py prepare ${{ matrix.variant }}
      - name: Check source-only correlation and pin controls
        run: |
          python3 .github/scripts/test-preview-selection-ab.py
          python3 .github/scripts/test-preview-inline-selection-correlation.py
          python3 .github/scripts/test-run-owned-app-tests.py
      - name: Generate the identical app and test source with selected pin
        id: generate
        run: |
          set -euo pipefail
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          cd MacDown2
          xcodegen generate
          cd ..
          MacDown2/scripts/pin-xcode-package-versions.sh
          MacDown2/scripts/pin-xcode-package-versions.sh --check
      - name: Compile the real app and test bundles
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration Debug ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) RELEASE_PREVIEW_PROBE' \
            -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "$RUNNER_TEMP/preview-grant-app" \
            -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO build-for-testing
      - name: Capture actual compiled app, test and Textual source hashes
        run: python3 .github/scripts/preview-selection-ab.py capture ${{ matrix.variant }}
      - name: Repeat ten-generation mounted Copy in fresh native test runs
        run: python3 .github/scripts/preview-selection-ab.py run ${{ matrix.variant }}
      - name: Verify Xcode kept the selected immutable lock
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: MacDown2/scripts/pin-xcode-package-versions.sh --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-selection-ab-${{ matrix.variant }}
          path: ${{ runner.temp }}/preview-grant-probe/
          include-hidden-files: true
          if-no-files-found: warn
