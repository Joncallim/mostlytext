name: Private deliberate inline-style dependency resolution
permissions:
  contents: read
on:
  workflow_dispatch:
concurrency:
  group: private-inline-pin-resolution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve-one-immutable-pin:
    if: github.repository == 'Joncallim/mostlytext'
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select supported Xcode and check exact graph-admission controls
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep '26' | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          python3 .github/scripts/test-inline-style-pin-resolution.py
      - name: Resolve only the deliberate immutable Textual update and restore original source
        run: python3 .github/scripts/resolve-inline-style-pin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-inline-style-pin-resolution
          path: ${{ runner.temp }}/mostlytext-focus/
          include-hidden-files: true
          if-no-files-found: error
