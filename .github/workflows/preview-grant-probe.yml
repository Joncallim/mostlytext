name: Preview directory grant consumer qualification

permissions:
  contents: read

on:
  pull_request:
    branches: [main, master, integration-final]
    paths:
      - 'MacDown2/MacDown2/*Preview*.swift'
      - 'MacDown2/MacDown2/Preview*.swift'
      - 'MacDown2/MacDown2/Secured*.swift'
      - 'MacDown2/MacDown2Tests/*Preview*.swift'
      - 'MacDown2/MacDown2Tests/Preview*.swift'
      - 'MacDown2/MacDown2Tests/Secured*.swift'
      - 'MacDown2/Packages/MacDownKit/Sources/Preview/**'
      - '.github/workflows/preview-grant-probe.yml'
      - '.github/scripts/*preview-grant-probe.py'
      - '.github/scripts/check-preview-parsed-frame.py'
      - '.github/scripts/test-preview-grant-tripwire.py'
  workflow_dispatch:

concurrency:
  group: preview-grant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-consumers:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        pair: [revision, viewport, disappear]
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select deployment-matching Xcode and OS
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sw_vers
          git rev-parse HEAD
      - name: Generate and pin the actual app project
        id: pin
        run: |
          set -euo pipefail
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          cd MacDown2
          xcodegen generate
          cd ..
          MacDown2/scripts/pin-xcode-package-versions.sh
      - name: Verify diagnostic ownership controls
        run: |
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-preview-grant-tripwire.py
      - name: Record exact application inputs and configuration
        run: python3 .github/scripts/verify-preview-grant-probe.py "$RUNNER_TEMP/preview-grant-probe" ${{ matrix.configuration }} --pair ${{ matrix.pair }}
      - name: Compile real app and test bundles
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration ${{ matrix.configuration }} ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) RELEASE_PREVIEW_PROBE' \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/preview-grant-app" \
            -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO build-for-testing
      - name: Execute the actual three consumer paths and independent network control
        run: |
          set -euo pipefail
          PREVIEW_PHASE_SELECTION="-skip-testing:MacDown2Tests/SecuredPreviewReleaseProbeTests"
          if [ "${{ matrix.configuration }}" = Release ]; then
            PREVIEW_PHASE_SELECTION="-only-testing:MacDown2Tests/SecuredPreviewReleaseProbeTests"
          fi
          python3 .github/scripts/run-preview-grant-probe.py "$RUNNER_TEMP/preview-grant-probe/network.json" ${{ matrix.configuration }} -- \
            python3 .github/scripts/run-owned-app-tests.py "$RUNNER_TEMP/preview-grant-probe/diagnostics" \
            "$RUNNER_TEMP/preview-grant-app/Build/Products/${{ matrix.configuration }}/MacDown2.app/Contents/MacOS/MacDown2" -- \
            xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -configuration ${{ matrix.configuration }} ENABLE_TESTABILITY=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) RELEASE_PREVIEW_PROBE' \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/preview-grant-app" \
            -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO \
            -only-testing:MacDown2Tests/PreviewDirectoryGrantBackingTests \
            -only-testing:MacDown2Tests/PreviewResourceAdmissionTests \
            -only-testing:MacDown2Tests/PreviewResourceWindowStateTests \
            -only-testing:MacDown2Tests/BoundedHTMLPreviewHandlerTests \
            -only-testing:MacDown2Tests/SecuredHTMLPreviewNativeTests \
            -only-testing:MacDown2Tests/SecuredMarkdownMountedTests \
            -only-testing:MacDown2Tests/SecuredMarkdownViewportTests \
            -only-testing:MacDown2Tests/SecuredPreviewImageAdmissionTests \
            -only-testing:MacDown2Tests/PreviewImageDecodeBudgetTests \
            -only-testing:MacDown2Tests/TextualAttachmentInterceptionTests \
            -only-testing:MacDown2Tests/SecuredPreviewNetworkTests \
            "$PREVIEW_PHASE_SELECTION" test-without-building \
            | tee "$RUNNER_TEMP/preview-grant-probe/probe.log"
      - name: Prove omission fails and exact restored mounted application passes
        run: python3 .github/scripts/check-preview-parsed-frame.py "$RUNNER_TEMP/preview-grant-probe" ${{ matrix.configuration }} --pair ${{ matrix.pair }}
      - name: Verify exact source and actual selected execution
        if: always()
        run: python3 .github/scripts/verify-preview-grant-probe.py "$RUNNER_TEMP/preview-grant-probe" ${{ matrix.configuration }} --pair ${{ matrix.pair }} --verify --require-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-grant-app-tests-${{ matrix.configuration }}-${{ matrix.pair }}
          path: |
            ${{ runner.temp }}/preview-grant-probe/receipt.json
            ${{ runner.temp }}/preview-grant-probe/network.json
            ${{ runner.temp }}/preview-grant-probe/parsed-frame*.log
            ${{ runner.temp }}/preview-grant-probe/parsed-frame*.json
            ${{ runner.temp }}/preview-grant-probe/parsed-frame*-diagnostics/*.json
            ${{ runner.temp }}/preview-grant-probe/parsed-frame*-diagnostics/*.sample.txt
            ${{ runner.temp }}/preview-grant-probe/parsed-frame*-diagnostics/*.log
            ${{ runner.temp }}/preview-grant-probe/probe.log
            ${{ runner.temp }}/preview-grant-probe/diagnostics/*.json
            ${{ runner.temp }}/preview-grant-probe/diagnostics/*.sample.txt
            ${{ runner.temp }}/preview-grant-probe/diagnostics/*.log
          if-no-files-found: warn
      - name: Verify immutable dependency locks
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: |
          set -euo pipefail
          MacDown2/scripts/pin-xcode-package-versions.sh --check
          git diff --exit-code -- MacDown2/Packages/MacDownKit/Package.resolved
