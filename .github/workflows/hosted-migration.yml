name: Normal Release development-profile migration rehearsal
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/hosted-migration/**'
      - '.github/scripts/*migration*.py'
      - '.github/workflows/hosted-migration.yml'
  workflow_dispatch:
concurrency:
  group: hosted-migration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  valid-development-profile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: valid-profile
            migration-option: ''
          - scenario: future-session
            migration-option: '--future-session'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode and admit only the fixed disposable host
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          brew install xcodegen
          python3 .github/scripts/test-run-owned-app-tests.py
          python3 .github/scripts/test-hosted-focus-guard.py
          python3 .github/scripts/test-hosted-migration.py ProfileEvidenceTests
          python3 .github/scripts/prepare-hosted-migration.py prepare ${{ matrix.migration-option }}
          cd MacDown2
          xcodegen generate
          scripts/pin-xcode-package-versions.sh
      - name: Compile the ordinary locked Release app and private canonical seed
        run: |
          set -euo pipefail
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release -destination 'platform=macOS,arch=arm64' ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/app" -onlyUsePackageVersionsFromResolvedFile CODE_SIGN_IDENTITY=- build 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/app-build.log"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/scripts/native-cli-app-host.swift -o "$RUNNER_TEMP/mostlytext-focus/normal-app-host"
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete .github/hosted-public-focus/HostFacts.swift -o "$RUNNER_TEMP/mostlytext-focus/host-facts"
          swift build --package-path "$RUNNER_TEMP/mostlytext-focus/seed" --configuration release --force-resolved-versions 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/seed-build.log"
          python3 .github/scripts/prepare-hosted-migration.py bind-built ${{ matrix.migration-option }}
      - name: Build the private actual-input control and migration driver
        run: |
          set -euo pipefail
          xcodebuild -project "$RUNNER_TEMP/mostlytext-focus/fixture/HostedPublicFocus.xcodeproj" -scheme HostedPublicFocus -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mostlytext-focus/control" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/control-build.log"
          python3 .github/scripts/prepare-hosted-migration.py bind-driver ${{ matrix.migration-option }}
      - name: Execute one positive and the normal migration then normal relaunch
        run: |
          set -euo pipefail
          python3 .github/scripts/run-hosted-migration.py ${{ matrix.migration-option }} 2>&1 | tee "$RUNNER_TEMP/mostlytext-focus/execution.log"
      - name: Preserve the complete first native compile and execution outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-normal-migration-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/mostlytext-focus/*.json
            ${{ runner.temp }}/mostlytext-focus/*.log
            ${{ runner.temp }}/mostlytext-focus/*.stdout
            ${{ runner.temp }}/mostlytext-focus/*.stderr
            ${{ runner.temp }}/mostlytext-focus/*.plist
            ${{ runner.temp }}/mostlytext-focus/*-owned/**
            ${{ runner.temp }}/mostlytext-focus/*.xcresult/**
            ${{ runner.temp }}/mostlytext-focus/documents/**
            ${{ runner.temp }}/mostlytext-focus/fixture/**
            ${{ runner.temp }}/mostlytext-focus/migration-compiled-inputs/**
            ${{ runner.temp }}/mostlytext-focus/profile-*/**
            ${{ runner.temp }}/mostlytext-focus/seed/Package.swift
            ${{ runner.temp }}/mostlytext-focus/seed/Package.swift.in
            ${{ runner.temp }}/mostlytext-focus/seed/Package.resolved
            ${{ runner.temp }}/mostlytext-focus/seed/SeedAdmission.swift
            ${{ runner.temp }}/mostlytext-focus/seed/SeedProfile.swift
            ${{ runner.temp }}/mostlytext-focus/seed/.build/release/SeedMigrationProfile
          include-hidden-files: true
