name: HostedPublicFocus
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: 'YES'
targets:
  HostedFocusControl:
    type: application
    platform: macOS
    sources: [Control]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.HostedFocus.Control
    info:
      path: Control-Info.plist
      properties:
        CFBundleDisplayName: MostlyText hosted input control
        CFBundleShortVersionString: '0.0.0'
        CFBundleVersion: '1'
  HostedFocusDriverTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Driver]
    dependencies:
      - target: HostedFocusControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.HostedFocus.Driver
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: HostedFocusControl
schemes:
  HostedPublicFocus:
    build:
      targets:
        HostedFocusControl: all
    test:
      config: Release
      targets: [HostedFocusDriverTests]
      parallelizable: false
