name: MostlyTextProductionFinderProbe
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
targets:
  ProductionFinderAutomationHost:
    type: application
    platform: macOS
    sources: [AutomationHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.ProductionFinderProbe.AutomationHost
    info:
      path: AutomationHost-Info.plist
      properties:
        CFBundleDisplayName: MostlyText Finder automation fixture
        CFBundleShortVersionString: '0.0.0'
        CFBundleVersion: '1'
        LSUIElement: true
  ProductionFinderTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [FinderTests]
    dependencies:
      - target: ProductionFinderAutomationHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mostlytext.ProductionFinderProbe.FinderTests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: ProductionFinderAutomationHost
schemes:
  ProductionFinderProbe:
    build:
      targets:
        ProductionFinderAutomationHost: all
    test:
      config: Release
      targets: [ProductionFinderTests]
      parallelizable: false
